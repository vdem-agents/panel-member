v2exdfvthg:
  description: "HOG veto power in practice"
  codebook_question: >-
    If the head of government took actions to veto a piece of legislation,
    would he/she be likely to succeed?
  clarification: >-
    By ''veto'', we mean either a partial veto (concerning any parts of a
    bill) or package vetoes (concerning whole bills) of bills that have
    already been passed by the legislature. The question refers to whether
    the head of government is considered to hold this power in practice,
    regardless of whether this is regulated by law and whether this power
    has been exercised or not.
  categories:
    - "No."
    - >-
      Yes, but the legislature can override the veto by a simple majority
      vote (a vote of more than half of those voting).
    - >-
      Yes, but the legislature can override the veto by an absolute
      majority vote (a vote of more than half of the members of the
      legislature).
    - >-
      Yes, but the legislature can override the veto by a
      qualified/extraordinary majority vote (a super-majority --- e.g., 2/3
      or 3/4 --- of those voting).
    - "Yes, with no possibility of override."
  state-dept: []
  freedom-house: []

