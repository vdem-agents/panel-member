  description: "Power distributed by sexual orientation"
  codebook_question: >-
    To what extent is political power distributed according to sexual
    orientation?
  clarification: >-
    This question contrasts (A) the political power of heterosexuals and
    lesbian, gay, bisexual, and transgender (LGBT) members of the polity
    who are not open about their sexuality with (B) the political power of
    lesbian, gay, bisexual, and transgender (LGBT) members of the polity
    who are open about their sexuality. (A) will be referred to as
    "heterosexual" and (B) as "LGBT."  Note that in comparing the political
    power of these two groups we are comparing their power per person. So,
    when we say that LGBT have less, equal, or more power than
    heterosexuals we mean relative to their share of the population (as
    near as this can be estimated).
  categories:
    - >-
      LGBTs are entirely excluded from the public sphere and thus deprived
      of any real political power (even though they may possess formal
      powers such as the ballot).
    - >-
      LGBTs have much less political power than heterosexuals. LGBTs enjoy
      formal rights to participate in politics but are subject to informal
      norms that often serve to exclude them from the halls of power.
    - "LGBTs have somewhat less political power than heterosexual citizens."
    - >-
      LGBTs have about the same political power as heterosexuals. Each
      group enjoys a degree of political power that is roughly proportional
      to their population.
    - >-
      LGBTs enjoy somewhat more political power than heterosexuals by
      virtue of greater wealth, education, and high level of organization
      and mobilization.
  state-dept: []
  freedom-house: []

v2pepwrses:
  description: "Power distributed by socioeconomic position"
  codebook_question: "Is political power distributed according to socioeconomic position?"
  clarification: >-
    All societies are characterized by some degree of economic (wealth and
    income) inequality. In some societies, income and wealth are
    distributed in a grossly unequal fashion. In others, the difference
    between rich and poor is not so great. Here, we are concerned not with
    the degree of social inequality but rather with the political effects
    of this inequality. Specifically, we are concerned with the extent to
    which wealth and income translates into political power.
  categories:
    - >-
      Wealthy people enjoy a virtual monopoly on political power. Average
      and poorer people have almost no influence.
    - >-
      Wealthy people enjoy a dominant hold on political power. People of
      average income have little say. Poorer people have essentially no
      influence.
    - >-
      Wealthy people have a very strong hold on political power. People of
      average or poorer income have some degree of influence but only on
      issues that matter less for wealthy people.
    - >-
      Wealthy people have more political power than others. But people of
      average income have almost as much influence and poor people also
      have a significant degree of political power.
    - >-
      Wealthy people have no more political power than those whose economic
      status is average or poor. Political power is more or less equally
      distributed across economic groups.
  state-dept: []
  freedom-house: []

v2pepwrsoc:
  description: "Power distributed by social group"
  codebook_question: "Is political power distributed according to social groups?"
  clarification: >-
    A social group is differentiated within a country by caste, ethnicity,
    language, race, region, religion, or some combination thereof. (It does
    not include identities grounded in sexual orientation or socioeconomic
    status.) Social group identity is contextually defined and is likely to
    vary across countries and through time. Social group identities are
    also likely to cross-cut, so that a given person could be defined in
    multiple ways, i.e., as part of multiple groups. Nonetheless, at any
    given point in time there are social groups within a society that are
    understood --- by those residing within that society --- to be
    different, in ways that may be politically relevant.
  categories:
    - >-
      Political power is monopolized by one social group comprising a
      minority of the population. This monopoly is institutionalized, i.e.,
      not subject to frequent change.
    - >-
      Political power is monopolized by several social groups comprising a
      minority of the population. This monopoly is institutionalized, i.e.,
      not subject to frequent change.
    - >-
      Political power is monopolized by several social groups comprising a
      majority of the population. This monopoly is institutionalized, i.e.,
      not subject to frequent change.
    - >-
      Either all social groups possess some political power, with some
      groups having more power than others; or different social groups
      alternate in power, with one group controlling much of the political
      power for a period of time, followed by another --- but all
      significant groups have a turn at the seat of power.
    - >-
      All social groups have roughly equal political power or there are no
      strong ethnic, caste, linguistic, racial, religious, or regional
      differences to speak of. Social group characteristics are not
      relevant to politics.
  state-dept: []
  freedom-house: []

v2psbars:
  description: "Barriers to parties"
  codebook_question: "How restrictive are the barriers to forming a party?"
  clarification: >-
    Barriers include legal requirements such as requirements for membership
    or financial deposits, as well as harassment.
  categories:
    - "Parties are not allowed."
    - >-
      It is impossible, or virtually impossible, for parties not affiliated
      with the government to form (legally).
    - >-
      There are significant obstacles (e.g. party leaders face high levels
      of regular political harassment by authorities).
    - >-
      There are modest barriers (e.g. party leaders face occasional
      political harassment by authorities).
    - "There are no substantial barriers."
  state-dept: []
  freedom-house: []

v2pscnslnl:
  description: "Candidate selection-national/local"
  codebook_question: "How centralized is legislative candidate selection within the parties?"
  clarification: >-
    The power to select candidates for national legislative elections is
    often divided between local/municipal party actors,
    regional/state-level party organizations, and national party leaders.
    One level usually dominates the selection process, while sometimes
    candidate selection is the outcome of bargaining between the different
    levels of party organization.
  categories:
    - >-
      National legislative candidates are selected exclusively by national
      party leaders.
    - >-
      National legislative candidate selection is dominated by national
      party leaders but with some limited influence from local or state
      level organizations. 2:National legislative candidates are chosen
      through bargaining across different levels of party organization.
      3:National legislative candidates are chosen by regional or
      state-level organizations, perhaps with some input from local party
      organizations or constituency groups. 4:National legislative
      candidates are chosen by a small cadre of local or municipal level
      actors. 5: National legislative candidates are chosen by constituency
      groups or direct primaries.
  state-dept: []
  freedom-house: []

v2pscohesv:
  description: "Legislative party cohesion"
  codebook_question: >-
    Is it normal for members of the legislature to vote with other members
    of their party on important bills?
  clarification: null
  categories:
    - >-
      Not really. Many members are elected as independents and party
      discipline is very weak.
    - >-
      More often than not. Members are more likely to vote with their
      parties than against them, but defections are common.
    - "Mostly. Members vote with their parties most of the time."
    - "Yes, absolutely. Members vote with their parties almost all the time."
  state-dept: []
  freedom-house: []

v2pscomprg:
  description: "Party competition across regions"
  codebook_question: >-
    Which of the following best describes the nature of electoral support
    for major parties (those gaining over 10 % of the vote)?
  clarification: >-
    Leave this question blank if election was nonpartisan, i.e., no parties
    (not even pro-government parties) were allowed.
  categories:
    - >-
      Most major parties are competitive in only one or two regions of the
      country, i.e., their support is heavily concentrated in a few areas.
    - >-
      Most major parties are competitive in some regions of the country,
      but not in others.
    - "Most major parties are competitive in most regions of the country."
  state-dept: []
  freedom-house: []

v2psnatpar:
  description: "National party control"
  codebook_question: "How unified is party control of the national government?"
  clarification: >-
    With respect to the executive, consider only those offices that have
    effective power over policymaking. (If there is a monarch or president
    with very little policymaking power, this office should not be
    considered.) With respect to bicameral legislatures, consider only the
    chamber, or chambers, that have effective policymaking power. (If the
    upper chamber is inactive or clearly subordinate, consider only the
    lower chamber.) Leave this question blank if election was nonpartisan,
    i.e., no parties (not even pro-government parties) were allowed.
  categories:
    - >-
      Unified coalition control. A single multi-party coalition controls
      the executive and legislative branches of the national government.
      (This is true almost by definition in a parliamentary system where a
      single coalition gathers together a majority of seats.).
    - >-
      Divided party control. (A) Different parties or individuals
      (unconnected to parties) control the executive and the legislature or
      (B) Executive power is divided between a president/monarch and a
      prime minister, each of which belongs to different parties; or
      between a non-partisan monarch and a prime minister.
    - >-
      Unified party control. A single party controls the executive and
      legislative branches of the national government. (This is true almost
      by definition in a parliamentary system where a single party has a
      majority of seats.).
  state-dept: []
  freedom-house: []

v2psoppaut:
  description: "Opposition parties autonomy"
  codebook_question: "Are opposition parties independent and autonomous of the ruling regime?"
  clarification: >-
    An opposition party is any party that is not part of the government,
    i.e., that has no control over the executive.
  categories:
    - "Opposition parties are not allowed."
    - >-
      There are no autonomous, independent opposition parties. Opposition
      parties are either selected or co-opted by the ruling regime.
    - >-
      At least some opposition parties are autonomous and independent of
      the ruling regime.
    - >-
      Most significant opposition parties are autonomous and independent of
      the ruling regime.
    - >-
      All opposition parties are autonomous and independent of the ruling
      regime.
  state-dept: []
  freedom-house: []

v2psorgs:
  description: "Party organizations"
  codebook_question: >-
    How many political parties for national-level office have permanent
    organizations?
  clarification: >-
    A permanent organization connotes a substantial number of personnel who
    are responsible for carrying out party activities outside of the
    election season.
  categories:
    - "No parties."
    - "Fewer than half of the parties."
    - "About half of the parties."
    - "More than half of the parties."
    - "All parties."
  state-dept: []
  freedom-house: []

v2psparban:
  description: "Party ban"
  codebook_question: "Are any parties banned?"
  clarification: >-
    This does not apply to parties that are barred from competing for
    failing to meet registration requirements or support thresholds.
  categories:
    - >-
      Yes. All parties except the state-sponsored party (and closely allied
      parties) are banned.
    - >-
      Yes. Elections are non-partisan or there are no officially recognized
      parties.
    - "Yes. Many parties are banned."
    - "Yes. But only a few parties are banned."
    - "No. No parties are officially banned."
  state-dept: []
  freedom-house: []

v2psplats:
  description: "Distinct party platforms"
  codebook_question: >-
    How many political parties with representation in the national
    legislature or presidency have publicly available party platforms
    (manifestos) that are publicized and relatively distinct from one
    another?
  clarification: >-
    In order to be counted in the affirmative, parties must have platforms
    that are both distinct (either in terms of content or generalized
    ideology) and publicly disseminated. This question is not intended to
    measure how much the public actually knows about these platforms or
    whether they are important in structuring policymaking.
  categories:
    - "None, or nearly none."
    - "Fewer than half."
    - "About half."
    - "More than half."
    - "All, or nearly all."
  state-dept: []
  freedom-house: []

v2psprbrch:
  description: "Party branches"
  codebook_question: "How many parties have permanent local party branches?"
  clarification: null
  categories:
    - "None."
    - "Fewer than half."
    - "About half."
    - "More than half."
    - "All."
  state-dept: []
  freedom-house: []

v2psprlnks:
  description: "Party linkages"
  codebook_question: >-
    Among the major parties, what is the main or most common form of
    linkage to their constituents?
  clarification: >-
    A party-constituent linkage refers to the sort of "good" that the party
    offers in exchange for political support and participation in party
    activities.
  categories:
    - >-
      Clientelistic. Constituents are rewarded with goods, cash, and/or
      jobs.
    - "Mixed clientelistic and local collective."
    - >-
      Local collective. Constituents are rewarded with local collective
      goods, e.g., wells, toilets, markets, roads, bridges, and local
      development.
    - "Mixed local collective and policy/programmatic."
    - >-
      Policy/programmatic. Constituents respond to a party's positions on
      national policies, general party programs, and visions for society.
  state-dept: []
  freedom-house: []

v2pssunpar:
  description: "Subnational party control"
  codebook_question: >-
    Does a single party control important policymaking bodies across
    subnational units (regional and local governments)?
  clarification: >-
    Leave this question blank if election was nonpartisan, i.e., no parties
    (not even pro-government parties) were allowed.
  categories:
    - >-
      In almost all subnational units (at least 90%), a single party
      controls all or virtually all policymaking bodies.
    - >-
      In most subnational units (66%-90%), a single party controls all or
      virtually all policymaking bodies.
    - >-
      In few subnational units (less than 66%), a single party controls all
      or virtually all policymaking bodies.
  state-dept: []
  freedom-house: []

v2lgcomslo:
  held_out: true
  description: "Lower chamber committees"
  codebook_question: >-
    Does the lower (or unicameral) chamber of the legislature have a
    functioning committee system?
  clarification: null
  categories:
    - "No, there are no committees."
    - "Yes, but there are only special (not permanent) committees."
    - >-
      Yes, there are permanent committees, but they are not very
      significant in affecting the course of policy.
    - >-
      Yes, there are permanent committees that have strong influence on the
      course of policymaking.
  state-dept: []
  freedom-house: []

v2lgcrrpt:
  held_out: true
  description: "Legislature corrupt activities"
  codebook_question: "Do members of the legislature abuse their position for financial gain?"
  clarification: >-
    This includes any of the following: (a) accepting bribes, (b) helping
    to obtain government contracts for firms that the legislator (or
    his/her family/friends/political supporters) own, (c) doing favors for
    firms in exchange for the opportunity of employment after leaving the
    legislature, (d) stealing money from the state or from campaign
    donations for personal use. Please make your best estimate, based upon
    what is known or suspected to be true.
  categories:
    - "Commonly. Most legislators probably engage in these activities."
    - "Often. Many legislators probably engage in these activities."
    - "Sometimes. Some legislators probably engage in these activities."
    - >-
      Very occasionally. There may be a few legislators who engage in these
      activities but the vast majority do not.
    - "Never, or hardly ever."
  state-dept: []
  freedom-house: []

v2lgdomchm:
  held_out: true
  description: "Legislature dominant chamber"
  codebook_question: "If the legislature is bicameral, which chamber is dominant?"
  clarification: null
  categories:
    - "The lower chamber is clearly dominant."
    - "The lower chamber is somewhat more powerful on most issues."
    - "They are roughly co-equal in power."
    - "The upper chamber is somewhat more powerful on most issues."
    - "The upper chamber is clearly dominant."
  state-dept: []
  freedom-house: []

v2lgdsadlo:
  held_out: true
  description: "Representation of disadvantaged social groups"
  codebook_question: >-
    Considering all disadvantaged social groups in the country, how well
    represented are these groups, as a whole, in the national legislature?
  clarification: >-
    Disadvantage refers to socioeconomic disadvantage. Specifically, in
    order to be considered disadvantaged members of a social group must
    have an average income that is significantly below the median national
    income.
  categories:
    - "They have no representation at all."
    - >-
      They are highly under-represented relative to their proportion of the
      general population.
    - >-
      They are slightly under-represented relative to their proportion of
      the general population.
    - >-
      They are represented roughly equal relative to their proportion of
      the general population.
    - >-
      They are over-represented relative to their proportion of the general
      population.
  state-dept: []
  freedom-house: []

v2lgdsadlobin:
  held_out: true
  description: "Representation of disadvantaged social groups binary"
  codebook_question: "Are there disadvantaged groups in the society?"
  clarification: >-
    Disadvantage refers to socioeconomic disadvantage. Specifically, in
    order to be considered a disadvantaged member of a social group, one
    must have an average income that is significantly below the median
    national income.
  categories:
    - "No."
    - "Yes."
  state-dept: []
  freedom-house: []

v2lgfunds:
  held_out: true
  description: "Legislature controls resources"
  codebook_question: >-
    In practice, does the legislature control the resources that finance
    its own internal operations and the perquisites of its members?
  clarification: null
  categories:
    - >-
      No. The benefits legislators receive or the finances needed for the
      legislature's operation depend on remaining in good standing with an
      outside authority, such as the executive.
    - "Yes."
  state-dept: []
  freedom-house: []

v2lginvstp:
  held_out: true
  description: "Legislature investigates in practice"
  codebook_question: >-
    If the executive were engaged in unconstitutional, illegal, or
    unethical activity, how likely is it that a legislative body (perhaps a
    whole chamber, perhaps a committee, whether aligned with government or
    opposition) would conduct an investigation that would result in a
    decision or report that is unfavorable to the executive?
  clarification: null
  categories:
    - "Extremely unlikely."
    - "Unlikely."
    - "As likely as not."
    - "Likely."
    - "Certain or nearly certain."
  state-dept: []
  freedom-house: []

v2lglegplo:
  held_out: true
  description: "Lower chamber legislates in practice"
  codebook_question: >-
    In practice, is the approval of the lower (or unicameral) chamber of
    the legislature required to pass legislation?
  clarification: null
  categories:
    - >-
      No. Legislation is routinely passed without the approval of the lower
      (or unicameral) chamber of the legislature.
    - >-
      Yes, usually. Legislation is usually passed with the approval of the
      lower (or unicameral) chamber of the legislature, but occasionally
      the legislature is by-passed.
    - >-
      Yes, always. Legislation of any consequence is always approved by the
      lower (or unicameral) chamber of the legislature.
  state-dept: []
  freedom-house: []

v2lglegpup:
  held_out: true
  description: "Upper chamber legislates in practice"
  codebook_question: >-
    In practice, is the approval of the upper chamber of the legislature
    required to pass legislation?
  clarification: null
  categories:
    - >-
      No. Legislation is routinely passed without the approval of the upper
      chamber of the legislature.
    - >-
      Yes, usually. Legislation is usually passed with the approval of the
      upper chamber of the legislature, but occasionally the legislature is
      by-passed.
    - >-
      Yes, always. Legislation of any consequence is always approved by the
      upper chamber of the legislature.
  state-dept: []
  freedom-house: []

v2lgoppart:
  held_out: true
  description: "Legislature opposition parties"
  codebook_question: >-
    Are opposition parties (those not in the ruling party or coalition)
    able to exercise oversight and investigatory functions against the
    wishes of the governing party or coalition?
  clarification: null
  categories:
    - "No, not at all."
    - "Occasionally."
    - "Yes, for the most part."
  state-dept: []
  freedom-house: []

v2lgotovst:
  held_out: true
  description: "Executive oversight"
  codebook_question: >-
    If executive branch officials were engaged in unconstitutional,
    illegal, or unethical activity, how likely is it that a body other than
    the legislature, such as a comptroller general, general prosecutor, or
    ombudsman, would question or investigate them and issue an unfavorable
    decision or report?
  clarification: null
  categories:
    - "Extremely unlikely."
    - "Unlikely."
    - "Very uncertain."
    - "Likely."
    - "Certain or nearly certain."
  state-dept: []
  freedom-house: []

v2lgqstexp:
  held_out: true
  description: "Legislature questions officials in practice"
  codebook_question: >-
    In practice, does the legislature routinely question executive branch
    officials?
  clarification: >-
    By ''question'' we mean, for example, the power of summons through
    which the head of state or head of government could be forced to
    explain its policies or testify.
  categories:
    - "No --- never or very rarely."
    - "Yes --- routinely."
  state-dept: []
  freedom-house: []

v2lgsrvlo:
  held_out: true
  description: "Lower chamber members serve in government"
  codebook_question: >-
    In practice, are members of the lower (or unicameral) chamber of the
    legislature able to serve simultaneously as ministers in the
