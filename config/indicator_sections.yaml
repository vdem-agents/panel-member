  clarification: null
  categories:
    - "No."
    - "Yes."
  state-dept: []
  freedom-house: []

v2lgstafflo:
  held_out: true
  description: "Lower chamber staff"
  codebook_question: >-
    Does each member of the lower (or unicameral) chamber of the
    legislature have at least one staff member with policy expertise?
  clarification: null
  categories:
    - "No."
    - "Yes."
  state-dept: []
  freedom-house: []

v2svdomaut:
  held_out: true
  description: "Domestic autonomy"
  codebook_question: >-
    Is the state autonomous from the control of other states with respect
    to the conduct of domestic policy?
  clarification: >-
    The question of domestic autonomy does not include restrictions
    emanating from treaties (e.g., NATO), international organizations
    (e.g., the WTO), or confederations (e.g., the European Union) if these
    agreements are freely negotiated by the state and if the state is free
    to exit from that treaty, organization, or confederation. Nor does it
    include restrictions on policymaking emanating from international
    market forces and trans-national corporations.
  categories:
    - >-
      Non-autonomous. National level authority is exercised by an external
      power, either by law or in practice. The most common examples of this
      are direct colonial rule and military occupation (e.g. quadripartite
      occupation of Germany in 1945). It also includes situations in which
      domestic actors provide de jure cover for de facto control by a
      foreign power (e.g. Vichy France). However, control of some part of
      the territory of a state by an enemy during war is not considered
      control by external actors if the sovereign government remains on
      scene and continues to wage conventional war (e.g., the USSR during
      WW II).
    - >-
      Semi-autonomous. An external political actor directly constrains the
      ability of domestic actors to rule, decides who can or cannot rule
      through formal rules or informal understandings, or precludes certain
      policies through explicit treaty provisions or well-understood rules
      of the game from which the subject state cannot withdraw. Examples
      include Soviet "satellite" states in Eastern Europe, and situations
      where colonial powers grant limited powers of national
      self-government to their possessions (e.g., protectorates and limited
      home government).
    - >-
      Autonomous. Domestic political actors exercise political authority
      free of the direct control of external political actors.
  state-dept: []
  freedom-house: []

v2svinlaut:
  held_out: true
  description: "International autonomy"
  codebook_question: >-
    Is the state autonomous from the control of other states with respect
    to the conduct of its foreign policy?
  clarification: null
  categories:
    - >-
      Non-autonomous. Foreign policy is controlled by an external power,
      either de facto or de jure. The most common examples of this are
      colonial rule and military occupation (e.g. quadripartite occupation
      of Germany in 1945). Situations in which domestic actors provide de
      jure cover for de facto control by a foreign power should not be
      construed as semi-autonomy (e.g. Vichy France). Governments in exile
      that control underground forces waging unconventional warfare are not
      considered as mitigating an occupation regime (e.g. countries under
      German occupation during WWII).
    - >-
      Semi-autonomous. An external political actor directly constrains the
      ability of domestic actors to pursue an independent foreign policy
      course in some important areas. This may be the product of explicit
      treaty provisions or well-understood rules of the game from which the
      subject state cannot withdraw. Examples would include Soviet
      strictures over rule in so-called "satellite" states in Eastern
      Europe, and explicitly negotiated postwar settlements (e.g. Austria
      following WWII).
    - >-
      Autonomous. Domestic political actors exercise foreign policy free of
      the direct control of external political actors. Direct control is
      meant to exclude the exercise of constraint or the impact of
      interdependence in the international system. Treaties in which states
      concede some part of that control to a supra- or international
      organization voluntarily, and from which there is a possibility of
      exit should not be interpreted as a violation of autonomy.
  state-dept: []
  freedom-house: []

v2stcritapparm:
  held_out: true
  description: "Criteria for appointment decisions in the armed forces"
  codebook_question: >-
    To what extent are appointment decisions in the armed forces based on
    personal or political connections or alternatively based on skills and
    merit?
  clarification: >-
    Appointment decisions include hiring, firing and promotions in the
    armed forces. Note that the question refers to the typical de facto
    (rather than de jure) situation obtaining in the armed forces. If there
    are large differences between different branches of the armed forces or
    between top and lower level ranks please try to consider the average
    when answering the question.
  categories:
    - >-
      All appointment decisions in the armed forces are based on personal
      or political connections. None are based on skills and merit.
    - >-
      Most appointment decisions in the armed forces are based on personal
      or political connections. Only a few are based on skills and merit.
    - >-
      Approximately half of the appointment decisions in the armed forces
      are based on personal or political connections. Approximately half
      are based on skills and merit.
    - >-
      Only few of the appointment decisions in the armed forces are based
      on personal or political connections. Most are based on skills and
      merit.
    - >-
      None of the appointment decisions in the armed forces are based on
      personal or political connections. All are based on skills and merit.
  state-dept: []
  freedom-house: []

v2stcritrecadm:
  held_out: true
  description: "Criteria for appointment decisions in the state administration"
  codebook_question: >-
    To what extent are appointment decisions in the state administration
    based on personal and political connections, as opposed to skills and
    merit?
