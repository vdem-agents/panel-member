v2exembez:
  description: "Executive embezzlement and theft"
  codebook_question: >-
    How often do members of the executive (the head of state, the head of
    government, and cabinet ministers), or their agents, steal, embezzle,
    or misappropriate public funds or other state resources for personal or
    family use?
  clarification: null
  categories:
    - >-
      Constantly. Members of the executive act as though all public
      resources were their personal or family property.
    - >-
      Often. Members of the executive are responsible stewards of selected
      public resources but treat the rest like personal property.
    - >-
      About half the time. Members of the executive are about as likely to
      be responsible stewards of selected public resources as they are to
      treat them like personal property.
    - >-
      Occasionally. Members of the executive are responsible stewards of
      most public resources but treat selected others like personal
      property.
    - >-
      Never, or hardly ever. Members of the executive are almost always
      responsible stewards of public resources and keep them separate from
      personal or family property.
  state-dept: []
  freedom-house: []

v2exremhog:
  description: "HOG removal by legislature in practice"
  codebook_question: >-
    If the legislature, or either chamber of the legislature, took actions
    to remove the head of government from office, would it be likely to
    succeed even without having to level accusations of unlawful activity
    and without the involvement of any other agency?
  clarification: >-
    The question refers to whether the legislature (or either of its
    chambers) is considered to hold this power of removal in practice,
    regardless of whether this is regulated by law and whether this power
    has been exercised or not. Moreover, the question refers to removal
    other than through an impeachment process.
  categories:
    - "No, under no circumstances."
    - "No, unlikely, but there is a chance it would happen."
    - "Yes, probably, but there is a chance it would fail."
    - "Yes, most likely."
  state-dept: []
  freedom-house: []

