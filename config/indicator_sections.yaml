v2smgovsmalt:
  description: "Government social media alternatives"
  codebook_question: >-
    How prevalent is the usage of social media platforms that are wholly
    controlled by either the government or its agents in this country?
  clarification: null
  categories:
    - >-
      Essentially all social media usage takes place on platforms
      controlled by the state.
    - >-
      Most usage of social media is on state-controlled platforms, although
      some groups use non-state-controlled alternatives.
    - >-
      There is significant usage of both state-controlled and
      non-state-controlled social media platforms.
    - >-
      While some state-controlled social media platforms exist, their usage
      only represents a small share of social media usage in the country.
    - "Practically no one uses state-controlled social media platforms."
  state-dept: []
  freedom-house: []

v2smgovsmcenprc:
  description: "Government social media censorship in practice"
  codebook_question: >-
    To what degree does the government censor political content (i.e.,
    deleting or filtering specific posts for political reasons) on social
    media in practice?
  clarification: null
  categories:
    - "The government simply blocks all social media platforms."
    - >-
      The government successfully censors all social media with political
      content.
    - >-
      The government successfully censors a significant portion of
      political content on social media, though not all of it.
    - >-
      The government only censors social media with political content that
      deals with especially sensitive issues.
    - >-
      The government does not censor political social media content, with
      the exceptions mentioned in the clarifications section.
  state-dept: []
  freedom-house: []

v2smgovsmmon:
  description: "Government social media monitoring"
  codebook_question: >-
    How comprehensive is the surveillance of political content in social
    media by the government or its agents?
  clarification: null
  categories:
    - >-
      Extremely comprehensive. The government surveils virtually all
      content on social media.
    - >-
      Mostly comprehensive. The government surveils most content on social
      media, with comprehensive monitoring of most key political issues.
    - >-
      Somewhat comprehensive. The government does not universally surveil
      social media but can be expected to surveil key political issues
      about half the time.
    - >-
      Limited. The government only surveils political content on social
      media on a limited basis.
    - >-
      Not at all, or almost not at all. The government does not surveil
      political content on social media, with the exceptions mentioned in
      the clarifications section.
  state-dept: []
  freedom-house: []

v2smlawpr:
  description: "Defamation protection"
  codebook_question: >-
    Does the legal framework provide protection against defamatory online
    content, or hate speech?
  clarification: null
  categories:
    - >-
      No. The law provides no protection against Internet defamation and
      hate speech.
    - >-
      Not really. The law provides a weak protection and to very limited
      range of circumstances.
    - >-
      Somewhat. The law provides some protection against Internet
      defamation and hate speech but in limited circumstances, or only to
      particular groups of people.
    - >-
      Mostly. The law provides protection against Internet defamation and
      hate speech under many circumstances, and to most groups of people.
    - >-
      Yes. The law provides comprehensive protection against Internet
      defamation and hate speech.
  state-dept: []
  freedom-house: []

v2smmefra:
  description: "Online media fractionalization"
  codebook_question: >-
    Do the major domestic online media outlets give a similar presentation
    of major (political) news?
  clarification: null
  categories:
    - >-
      No. The major domestic online media outlets give opposing
      presentation of major events.
    - >-
      Not really. The major domestic online media outlets differ greatly in
      the presentation of major events.
    - >-
      Sometimes. The major domestic online media outlets give a similar
      presentation of major events about half the time.
    - >-
      Mostly. The major domestic online media outlets mostly give a similar
      presentation of major events.
    - >-
      Yes. Although there are small differences in representation, the
      major domestic online media outlets give a similar presentation of
      major events.
  state-dept: []
  freedom-house: []

v2smonex:
  description: "Online media existence"
  codebook_question: "Do people consume domestic online media?"
  clarification: null
  categories:
    - >-
      Not at all. No one consumes domestic online media. Skip next question
      if this answer is selected.
    - "Limited. Domestic online media consumption is limited."
    - "Relatively extensive. Domestic online media consumption is common."
    - "Extensive. Almost everyone consumes domestic online media."
  state-dept: []
  freedom-house: []

v2smonper:
  description: "Online media perspectives"
  codebook_question: >-
    Do the major domestic online media outlets represent a wide range of
    political perspectives?
  clarification: null
  categories:
    - >-
      The major domestic online media outlets represent only the
      government’s perspective.
    - >-
      The major domestic online media outlets represent only the
      perspectives of the government and a government approved,
      semi-official opposition party.
    - >-
      The major domestic online media outlets represent a variety of
      political perspectives but they systematically ignore at least one
      political perspective that is important in this society.
    - >-
      All perspectives that are important in this society are represented
      in at least one of the major domestic online media outlets.
    - >-
      All perspectives that are important in this society are represented
      in many major domestic online media outlets.
  state-dept: []
  freedom-house: []

v2smorgavgact:
  description: "Average people’s use of social media to organize offline action"
  codebook_question: >-
    How often do average people use social media to organize offline
    political action of any kind?
  clarification: null
  categories:
    - >-
      Never or almost never. Average people have almost never used social
      media to organize offline political action.
    - >-
      Rarely. Average people do not typically use social media to organize
      offline political action.
    - >-
      Sometimes. There are a few cases in which average people have used
      social media to organize offline political action.
    - >-
      Often. There have been several cases in which average people have
      used social media to organize offline political action.
    - >-
      Regularly. There are numerous cases in which average people have used
      social media to organize offline political action.
  state-dept: []
  freedom-house: []

v2smorgelitact:
  description: "Elites’ use of social media to organize offline action"
  codebook_question: >-
    How often do domestic elites use social media to organize offline
    political action of any kind?
  clarification: null
  categories:
    - >-
      Never or almost never. Elites have almost never used social media to
      organize offline political action.
    - >-
      Rarely. Elites do not typically use social media to organize offline
      political action.
    - >-
      Sometimes. There are a few cases in which elites have used social
      media to organize offline political action.
    - >-
      Often. There have been several cases in which elites have used social
      media to organize offline political action.
    - >-
      Regularly. There are numerous cases in which elites have used social
      media to organize offline political action.
  state-dept: []
  freedom-house: []

v2smorgviol:
  description: "Use of social media to organize offline violence"
  codebook_question: "How often do people use social media to organize offline violence?"
  clarification: null
  categories:
    - >-
      Frequently. There are numerous cases in which people have used social
      media to organize offline violence.
    - >-
      Sometimes. There are a few cases in which people have used social
      media to organize offline violence.
    - >-
      Never. People have never used social media to organize offline
      violence.
  state-dept: []
  freedom-house: []

v2smparab:
  description: "Party dissemination of false information abroad"
  codebook_question: >-
    How often do major political parties and candidates for office use
    social media to disseminate misleading viewpoints or false information
    to influence citizens of other countries abroad?
  clarification: null
  categories:
    - >-
      Extremely often. Major political parties and candidates disseminate
      false information on all key political issues.
    - >-
      Often. Major political parties and candidates disseminate false
      information on many key political issues.
    - >-
      About half the time. Major political parties and candidates
      disseminate false information on some key political issues, but not
      others.
    - >-
      Rarely. Major political parties and candidates disseminate false
      information on only a few key political issues.
    - >-
      Never, or almost never. Major political parties and candidates never
      disseminate false information on key political issues.
  state-dept: []
  freedom-house: []

v2smpardom:
  description: "Party dissemination of false information domestic"
  codebook_question: >-
    How often do major political parties and candidates for office use
    social media to disseminate misleading viewpoints or false information
    to influence their own population?
  clarification: null
  categories:
    - >-
      Extremely often. Major political parties and candidates disseminate
      false information on all key political issues.
    - >-
      Often. Major political parties and candidates disseminate false
      information on many key political issues.
    - >-
      About half the time. Major political parties and candidates
      disseminate false information on some key political issues, but not
      others.
    - >-
      Rarely. Major political parties and candidates disseminate false
      information on only a few key political issues.
    - >-
      Never, or almost never. Major political parties and candidates never
      disseminate false information on key political issues.
  state-dept: []
  freedom-house: []

v2smpolcap:
  description: "Political parties cyber security capacity"
  codebook_question: >-
    Do the major political parties have sufficiently technologically
    skilled staff and resources to mitigate harm from cyber security
    threats?
  clarification: null
  categories:
    - >-
      No. The government does not have the capacity to counter even
      unsophisticated cyber security threats.
    - >-
      Not really. The government has the resources to combat only
      unsophisticated cyber attacks.
    - >-
      Somewhat. The government has the resources to combat moderately
      sophisticated cyber attacks.
    - >-
      Mostly. The government has the resources to combat most sophisticated
      cyber attacks.
    - >-
      Yes. The government has the resources to combat sophisticated cyber
      attacks, even those launched by highly skilled actors.
  state-dept: []
  freedom-house: []

v2smpolhate:
  description: "Political parties hate speech"
  codebook_question: >-
    How often do major political parties use hate speech as part of their
    rhetoric?
  clarification: >-
    Hate speech is any speech that is intended to insult, offend, or
    intimidate members of specific groups, defined by race, religion,
    sexual orientation, national origin, disability, or similar trait.
  categories:
    - "Extremely often."
    - "Often."
    - "Sometimes."
    - "Rarely."
    - "Never, or almost never."
  state-dept: []
  freedom-house: []

v2smpolsoc:
  description: "Polarization of society"
  codebook_question: >-
    How would you characterize the differences of opinions on major
    political issues in this society?
  clarification: >-
    While plurality of views exists in all societies, we are interested in
    knowing the extent to which these differences in opinions result in
    major clashes of views and polarization or, alternatively, whether
    there is general agreement on the general direction this society should
    develop.
  categories:
    - >-
      Serious polarization. There are serious differences in opinions in
      society on almost all key political issues, which result in major
      clashes of views.
    - >-
      Moderate polarization. There are differences in opinions in society
      on many key political issues, which result in moderate clashes of
      views.
    - >-
      Medium polarization. Differences in opinions are noticeable on about
      half of the key political issues, resulting in some clashes of views.
    - >-
      Limited polarization. There are differences in opinions on only a few
      key political issues, resulting in few clashes of views.
    - >-
      No polarization. There are differences in opinions but there is a
      general agreement on the direction for key political issues.
  state-dept: []
  freedom-house: []

v2smprivex:
  description: "Privacy protection by law exists"
  codebook_question: >-
    Does a legal framework to protect Internet users’ privacy and their
    data exist?
  clarification: null
  categories:
    - "No. (Skip to v2smregcap)"
    - "Yes"
  state-dept: []
  freedom-house: []

v2smregapp:
  description: "Government online content regulation approach"
  codebook_question: >-
    Does the government use its own resources and institutions to monitor
    and regulate online content or does it distribute this regulatory
    burden to private actors such as Internet service providers?
  clarification: null
  categories:
    - "All online content monitoring and regulation is done by the state."
    - >-
      Most online content monitoring and regulation is done by the state,
      though the state involves private actors in a limited way.
    - >-
      Some online content monitoring and regulation is done by the state,
      but the state also involves private actors in monitoring and
      regulation in various ways.
    - >-
      The state does little online content monitoring and regulation, and
      entrusts most of the monitoring and regulation to private actors.
    - >-
      The state off-loads all online content monitoring and regulation to
      private actors.
  state-dept: []
  freedom-house: []

v2smregcap:
  description: "Government capacity to regulate online content"
  codebook_question: >-
    Does the government have sufficient staff and resources to regulate
    Internet content in accordance with existing law?
  clarification: null
  categories:
    - >-
      No, almost all online activity happens outside of reach of the state,
      where it lacks the capacity to remove illegal content.
    - >-
      Not really. The state has extremely limited resources to regulate
      online content.
    - >-
      Somewhat. The state has the capacity to regulate only some online
      content or some portions of the law.
    - >-
      Mostly. The state has robust capacity to regulate online content,
      though not enough to regulate all content and all portions of the
      law.
    - >-
      Yes, the government has sufficient capacity to regulate all online
      content.
  state-dept: []
  freedom-house: []

v2smregcon:
  description: "Internet legal regulation content"
  codebook_question: >-
    What type of content is covered in the legal framework to regulate
    Internet?
  clarification: null
  categories:
    - "The state can remove any content at will."
    - >-
      The state can remove most content, and the law protects speech in
      only specific, and politically uncontroversial contexts.
    - >-
      The legal framework is ambiguous. The state can remove some
      politically sensitive content, while other is protected by law.
    - >-
      The law protects most political speech, but the state can remove
      especially politically controversial content.
    - >-
      The law protects political speech, and the state can only remove
      content if it violates well-established legal criteria.
  state-dept: []
  freedom-house: []

v2elaccept:
  description: "Election losers accept results"
  codebook_question: >-
    Did losing parties and candidates accept the result of this national
    election within three months?
  clarification: null
  categories:
    - >-
      None. None of the losing parties or candidates accepted the results
      the election, or all opposition was banned.
    - >-
      A few. Some but not all losing parties or candidates accepted the
      results but those who constituted the main opposition force did not.
    - >-
      Some. Some but not all opposition parties or candidates accepted the
      results but it is unclear whether they constituted a major opposition
      force or were relatively insignificant.
    - >-
      Most. Many but not all opposition parties or candidates accepted the
      results and those who did not had little electoral support.
    - "All. All parties and candidates accepted the results."
  state-dept: []
  freedom-house: []

v2elasmoff:
  description: "Election assume office"
  codebook_question: >-
    Following this national election, did winners assume office according
    to prescribed constitutional rules and norms?
  clarification: null
  categories:
    - >-
      No. The official winner of the election was prevented from assuming
      office by unconstitutional means.
    - >-
      Partially. The official winner/winning party or largest vote-getter
      was forced at least in part by unconstitutional means to share power,
      or delay assuming power for more than 6 months.
    - >-
      Yes. Constitutional rules and norms were followed and the official
      winner/winning party or largest vote-getter assumed office
      accordingly (or continued in office).
  state-dept: []
  freedom-house: []

v2elboycot:
  description: "Election boycotts"
  codebook_question: >-
    In this national election, did any registered opposition candidates or
    parties boycott?
  clarification: >-
    A boycott is a deliberate and public refusal to participate in an
    election by a candidate or party who is eligible to participate.
  categories:
    - "Total. All opposition parties and candidates boycotted the election."
    - >-
      Significant. Some but not all opposition parties or candidates
      boycotted but they constituted a major opposition force.
    - >-
      Ambiguous. Some but not all opposition parties or candidates
      boycotted but it is unclear whether they would have constituted a
      major electoral force.
    - >-
      Minor. A few opposition parties or candidates boycotted and they were
      relatively insignificant ones.
    - "Nonexistent. No parties or candidates boycotted the elections."
  state-dept: []
  freedom-house: []

v2eldonate:
  description: "Disclosure of campaign donations"
  codebook_question: >-
    Are there disclosure requirements for donations to national election
    campaigns?
  clarification: null
  categories:
    - "No. There are no disclosure requirements."
    - >-
      Not really. There are some, possibly partial, disclosure requirements
      in place but they are not observed or enforced most of the time.
    - >-
      Ambiguous. There are disclosure requirements in place, but it is
      unclear to what extent they are observed or enforced.
    - >-
      Mostly. The disclosure requirements may not be fully comprehensive
      (some donations not covered), but most existing arrangements are
      observed and enforced.
    - >-
      Yes. There are comprehensive requirements and they are observed and
      enforced almost all the time.
  state-dept: []
  freedom-house: []

v2elembaut:
  description: "EMB autonomy"
  codebook_question: >-
    Does the Election Management Body (EMB) have autonomy from government
    to apply election laws and administrative rules impartially in national
    elections?
  clarification: >-
    The EMB refers to whatever body (or bodies) is charged with
    administering national elections.
  categories:
    - >-
      No. The EMB is controlled by the incumbent government, the military,
      or other de facto ruling body.
    - >-
      Somewhat. The EMB has some autonomy on some issues but on critical
      issues that influence the outcome of elections, the EMB is partial to
      the de facto ruling body.
    - >-
      Ambiguous. The EMB has some autonomy but is also partial, and it is
      unclear to what extent this influences the outcome of the election.
    - >-
      Almost. The EMB has autonomy and acts impartially almost all the
      time. It may be influenced by the de facto ruling body in some minor
      ways that do not influence the outcome of elections.
    - >-
      Yes. The EMB is autonomous and impartially applies elections laws and
      administrative rules.
  state-dept: []
  freedom-house: []

v2elembcap:
  description: "EMB capacity"
  codebook_question: >-
    Does the Election Management Body (EMB) have sufficient staff and
    resources to administer a well-run national election?
  clarification: >-
    The EMB refers to whatever body (or bodies) is charged with
    administering national elections.
  categories:
    - >-
      No. There are glaring deficits in staff, financial, or other
      resources affecting the organization across the territory.
    - >-
      Not really. Deficits are not glaring but they nonetheless seriously
      compromised the organization of administratively well-run elections
      in many parts of the country.
    - >-
      Ambiguous. There might be serious deficiencies compromising the
      organization of the election but it could also be a product of human
      errors and co-incidence or other factors outside the control of the
      EMB.
    - >-
      Mostly. There are partial deficits in resources but these are neither
      serious nor widespread.
    - >-
      Yes. The EMB has adequate staff and other resources to administer a
      well-run election.
  state-dept: []
  freedom-house: []

v2elffelr:
  description: "Subnational elections free and fair"
  codebook_question: >-
    Taking all aspects of the pre-election period, election day, and the
    post-election process into account, would you consider subnational
    elections (regional and local, as previously identified) to be free and
    fair on average?
  clarification: >-
    This question refers to subnational levels that have elected offices
    and elections. It does not refer to subnational levels without elected
    offices and elections. If there were no subnational elections in any of
    the years covered in this survey, choose option 5. "Free and fair"
    refers to all aspects of the election process except the extent of
    suffrage (by law). Thus, a free and fair election may occur even if the
    law excludes significant groups (we measure that issue separately).
  categories:
    - >-
      No, not at all. The elections were fundamentally flawed and the
      official results had little if anything to do with the 'will of the
      people' (who won office).
    - >-
      Not really. While the elections allowed for some competition, the
      irregularities in the end affected the outcome of the elections (who
      won office).
    - >-
      Ambiguous. There was substantial competition and freedom of
      participation but there were also significant irregularities. It is
      hard to determine whether the irregularities affected the outcome or
      not (who won office).
    - >-
      Yes, somewhat. There were deficiencies and some degree of fraud and
      irregularities but these did not in the end affect the outcome (who
      won office).
    - >-
      Yes. There was some amount of human error and logistical restrictions
      but these were largely unintentional and without significant
      consequences.
  state-dept: []
  freedom-house: []

v2elffelrbin:
  description: "Subnational elections held"
  codebook_question: "Are subnational elections held?"
  clarification: null
  categories:
    - "No."
    - "Yes."
  state-dept: []
  freedom-house: []

v2elfrcamp:
  description: "Election free campaign media"
  codebook_question: >-
    In this national election, did parties or candidates receive either
    free or publicly financed access to national broadcast media?
  clarification: null
  categories:
    - "Either no parties or only the governing party receives free access."
    - "Some parties in addition to the governing party receive free access."
    - "All parties receive free access."
  state-dept: []
  freedom-house: []

v2elfrfair:
  description: "Election free and fair"
  codebook_question: >-
    Taking all aspects of the pre-election period, election day, and the
    post-election process into account, would you consider this national
    election to be free and fair?
  clarification: >-
    The only thing that should not be considered in coding this is the
    extent of suffrage (by law). Thus, a free and fair election may occur
    even if the law excludes significant groups (an issue measured
    separately).
  categories:
    - >-
      No, not at all. The elections were fundamentally flawed and the
      official results had little if anything to do with the 'will of the
      people' (i.e., who became president; or who won the legislative
      majority).
    - >-
      Not really. While the elections allowed for some competition, the
      irregularities in the end affected the outcome of the election (i.e.,
      who became president; or who won the legislative majority).
    - >-
      Ambiguous. There was substantial competition and freedom of
      participation but there were also significant irregularities. It is
      hard to determine whether the irregularities affected the outcome or
      not (as defined above).
    - >-
      Yes, somewhat. There were deficiencies and some degree of fraud and
      irregularities but these did not in the end affect the outcome (as
      defined above).
    - >-
      Yes. There was some amount of human error and logistical restrictions
      but these were largely unintentional and without significant
      consequences.
  state-dept: []
  freedom-house: []

v2elintim:
  description: "Election government intimidation"
  codebook_question: >-
    In this national election, were opposition candidates/parties/campaign
    workers subjected to repression, intimidation, violence, or harassment
    by the government, the ruling party, or their agents?
  clarification: >-
    Other types of clearly distinguishable civil violence, even if
    politically motivated, during the election period should not be
    factored in when scoring this indicator (it is dealt with separately).
  categories:
    - >-
      Yes. The repression and intimidation by the government or its agents
      was so strong that the entire period was quiet.
    - >-
      Yes, frequent: There was systematic, frequent and violent harassment
      and intimidation of the opposition by the government or its agents
      during the election period.
    - >-
      Yes, some. There was periodic, not systematic, but possibly centrally
      coordinated --- harassment and intimidation of the opposition by the
      government or its agents.
    - >-
      Restrained. There were sporadic instances of violent harassment and
      intimidation by the government or its agents, in at least one part of
      the country, and directed at only one or two local branches of
      opposition groups.
    - >-
      None. There was no harassment or intimidation of opposition by the
      government or its agents, during the election campaign period and
      polling day.
  state-dept: []
  freedom-house: []

v2elirreg:
  description: "Election other voting irregularities"
  codebook_question: >-
    In this national election, was there evidence of other intentional
    irregularities by incumbent and/or opposition parties, and/or vote
    fraud?
  clarification: >-
    Examples include use of double IDs, intentional lack of voting
    materials, ballot-stuffing, misreporting of votes, and false collation
    of votes. This question does not refer to lack of access to
    registration, harassment of opposition parties, manipulations of the
    voter registry or vote-buying (dealt with in previous questions).
  categories:
    - "Yes. There were systematic and almost nationwide other irregularities."
    - >-
      Yes, some. There were non-systematic, but rather common other
      irregularities, even if only in some parts of the country.
    - >-
      Sporadic. There were a limited number of sporadic other
      irregularities, and it is not clear whether they were intentional or
      disfavored particular groups.
    - >-
      Almost none. There were only a limited number of irregularities, and
      many were probably unintentional or did not disfavor particular
      groups' access to participation.
    - >-
      None. There was no evidence of intentional other irregularities.
      Unintentional irregularities resulting from human error and/or
      natural conditions may still have occurred.
  state-dept: []
  freedom-house: []

v2ellocpwr:
  description: "Local offices relative power"
  codebook_question: >-
    How would you characterize the relative power, in practice, of elected
    and non-elected offices at the local level?
  clarification: >-
    We are concerned with the relative power of local offices to each
    other, not the power of local offices relative to higher levels of
    government.  Please consider only major offices, such as the executive,
    assembly, and judiciary, not those of minor bureaucrats. (A body of
    government officials, such as an assembly or judiciary, counts as one
    office.) An office is ''subordinate'' if its officeholders can be
    chosen and removed by another office or if its decisions can be blocked
    or modified by another office, but it cannot similarly constrain the
    other office.
  categories:
    - >-
      All or nearly all elected offices are subordinate to non-elected
      offices at the local level.
    - >-
      Some elected offices are subordinate to non-elected offices at the
      local level.
    - >-
      Elected and non-elected offices are approximately equal in power at
      the local level.
    - >-
      Most non-elected offices are subordinate to elected offices at the
      local level.
    - >-
      All or nearly all non-elected offices are subordinate to elected
      offices at the local level.
  state-dept: []
  freedom-house: []

v2elmulpar:
  description: "Elections multiparty"
  codebook_question: "Was this national election multiparty?"
  clarification: null
  categories:
    - >-
      No. No-party or single-party and there is no meaningful competition
      (includes situations where a few parties are legal but they are all
      de facto controlled by the dominant party).
    - >-
      Not really. No-party or single-party (defined as above) but multiple
      candidates from the same party and/or independents contest
      legislative seats or the presidency.
    - >-
      Constrained. At least one real opposition party is allowed to contest
      but competition is highly constrained --- legally or informally.
    - >-
      Almost. Elections are multiparty in principle but either one main
      opposition party is prevented (de jure or de facto) from contesting,
      or conditions such as civil unrest (excluding natural disasters)
      prevent competition in a portion of the territory.
    - >-
      Yes. Elections are multiparty, even though a few marginal parties may
      not be permitted to contest (e.g. far-right/left extremist parties,
      anti-democratic religious or ethnic parties).
  state-dept: []
  freedom-house: []

v2elpaidig:
  description: "Election paid interest group media"
  codebook_question: >-
    In this election, were interest groups and individuals able to run paid
    campaign ads on national broadcast media?
  clarification: null
  categories:
    - "Not at all."
    - >-
      It is permitted but regulated in ways that, in practice, favor groups
      allied with the government.
    - "It is permitted without limit."
    - >-
      It is permitted but regulated in ways that, in practice, foster
      representation of diverse perspectives.
  state-dept: []
  freedom-house: []

v2elpdcamp:
  description: "Election paid campaign advertisements"
  codebook_question: >-
    In this national election, were parties or candidates able to run paid
    campaign ads on national broadcast media?
  clarification: null
  categories:
    - "Not at all."
    - >-
      It is permitted but regulated in ways that, in practice, favor the
      government and its allies.
    - "It is permitted without limit."
    - >-
      It is permitted but regulated in ways that, in practice, foster fair
      competition.
  state-dept: []
  freedom-house: []

v2elpeace:
  description: "Election other electoral violence"
  codebook_question: >-
    In this national election, was the campaign period, election day, and
    post-election process free from other types not by the government, the
    ruling party, or their agents) of violence related to the conduct of
    the election and the campaigns (but not conducted by the government and
    its agents)?
  clarification: null
  categories:
    - >-
      No. There was widespread violence between civilians occurring
      throughout the election period, or in an intense period of more than
      a week and in large swaths of the country. It resulted in a large
      number of deaths or displaced refugees.
    - >-
      Not really. There were significant levels of violence but not
      throughout the election period or beyond limited parts of the
      country. A few people may have died as a result, and some people may
      have been forced to move temporarily.
    - >-
      Somewhat. There were some outbursts of limited violence for a day or
      two, and only in a small part of the country. The number of injured
      and otherwise affected was relatively small.
    - >-
      Almost. There were only a few instances of isolated violent acts,
      involving only a few people; no one died and very few were injured.
    - "Peaceful. No election-related violence between civilians occurred."
  state-dept: []
  freedom-house: []

v2elpubfin:
  description: "Public campaign finance"
  codebook_question: >-
    Is significant public financing available for parties' and/or
    candidates' campaigns for national office?
  clarification: null
  categories:
    - "No. Public financing is not available."
    - >-
      Little. There is public financing but it is so small or so restricted
      that it plays a minor role in most parties' campaigns.
    - >-
      Ambiguous. There is some public financing available but it is unclear
      whether it plays a significant role for parties.
    - >-
      Partly. Public financing plays a significant role in the campaigns of
      many parties.
    - >-
      Yes. Public financing funds a significant share of expenditures by
      all, or nearly all parties.
  state-dept: []
  freedom-house: []

v2elrgpwr:
  description: "Regional offices relative power"
  codebook_question: >-
    How would you characterize the relative power, in practice, of elected
    and non-elected offices at the regional level?
  clarification: >-
    We are concerned with the relative power of regional offices to each
    other, not the power of regional offices relative to higher or lower
    levels of government.  Please consider only major offices, such as the
    executive, assembly, and judiciary, not those of minor bureaucrats. (A
    body of government officials, such as an assembly or judiciary, counts
    as one office.) An office is ''subordinate'' if its officeholders can
    be chosen and removed by another office or if its decisions can be
    blocked or modified by another office, but it cannot similarly
    constrain the other office.
  categories:
    - >-
      All or nearly all elected offices are subordinate to non-elected
      offices at the regional level.
    - >-
      Some elected offices are subordinate to non-elected offices at the
      regional level.
    - >-
      Elected and non-elected offices are approximately equal in power at
      the regional level.
    - >-
      Most non-elected offices are subordinate to elected offices at the
      regional level.
    - >-
      All or nearly all non-elected offices are subordinate to elected
      offices at the regional level.
  state-dept: []
  freedom-house: []

v2elrgstry:
  description: "Election voter registry"
  codebook_question: >-
    In this national election, was there a reasonably accurate voter
    registry in place and was it used?
  clarification: null
  categories:
    - "No. There was no registry, or the registry was not used."
    - >-
      No. There was a registry but it was fundamentally flawed (meaning 20%
      or more of eligible voters could have been disenfranchised or the
      outcome could have been affected significantly by double-voting and
      impersonation).
    - >-
      Uncertain. There was a registry but it is unclear whether potential
      flaws in the registry had much impact on electoral outcomes.
    - >-
      Yes, somewhat. The registry was imperfect but less than 10% of
      eligible voters may have been disenfranchised, and double-voting and
      impersonation could not have affected the results significantly.
    - >-
      Yes. The voter registry was reasonably accurate (less than 1% of
      voters were affected by any flaws) and it was applied in a reasonable
      fashion.
  state-dept: []
  freedom-house: []

v2elsnlsff:
  description: "Subnational election unevenness"
  codebook_question: >-
    Does the freeness and fairness of subnational elections vary across
    different areas of the country?
  clarification: >-
    Subnational elections refer to elections to regional or local offices,
    as specified above.
  categories:
    - >-
      Yes. Subnational elections in some areas of the country are
      significantly more free and fair (or, alternatively, significantly
      less free and fair) than subnational elections in other areas of the
      country.
    - >-
      Somewhat. Subnational elections in some areas of the country are
      somewhat more free and fair (or, alternatively, somewhat less free
      and fair) than subnational elections in other areas of the country.
    - >-
      No. Subnational elections in most or all areas of the country are
      equally free and fair (or, alternatively, equally not free and not
      fair).
  state-dept: []
  freedom-house: []

v2elvotbuy:
  description: "Election vote buying"
  codebook_question: >-
    In this national election, was there evidence of vote and/or turnout
    buying?
  clarification: >-
    Vote and turnout buying refers to the distribution of money or gifts to
    individuals, families, or small groups in order to influence their
    decision to vote/not vote or whom to vote for. It does not include
    legislation targeted at specific constituencies, i.e. "porkbarrel"
    legislation.
  categories:
    - >-
      Yes. There was systematic, widespread, and almost nationwide
      vote/turnout buying by almost all parties and candidates.
    - >-
      Yes, some. There were non-systematic but rather common vote-buying
      efforts, even if only in some parts of the country or by one or a few
      parties.
    - >-
      Restricted. Money and/or personal gifts were distributed by parties
      or candidates but these offerings were more about meeting an
      ‘entry-ticket' expectation and less about actual vote choice or
      turnout, even if a smaller number of individuals may also be
      persuaded.
    - >-
      Almost none. There was limited use of money and personal gifts, or
      these attempts were limited to a few small areas of the country. In
      all, they probably affected less than a few percent of voters.
    - "None. There was no evidence of vote/turnout buying."
  state-dept: []
  freedom-house: []

v2juaccnt:
  description: "Judicial accountability"
  codebook_question: >-
    When judges are found responsible for serious misconduct, how often are
    they removed from their posts or otherwise disciplined?
  clarification: null
  categories:
    - "Never."
    - "Seldom."
    - "About half of the time."
    - "Usually."
    - "Always."
  state-dept: []
  freedom-house: []

v2jucomp:
  description: "Compliance with judiciary"
  codebook_question: >-
    How often would you say the government complies with important
    decisions by other courts with which it disagrees?
  clarification: >-
    We are looking for a summary judgment for the entire judiciary,
    excluding the high court. You should consider judges on both ordinary
    courts and specialized courts.
  categories:
    - "Never."
    - "Seldom."
    - "About half of the time."
    - "Usually."
    - "Always."
  state-dept: []
  freedom-house: []

v2jucorrdc:
  description: "Judicial corruption decision"
  codebook_question: >-
    How often do individuals or businesses make undocumented extra payments
    or bribes in order to speed up or delay the process or to obtain a
    favorable judicial decision?
  clarification: null
  categories:
    - "Always."
    - "Usually."
    - "About half of the time."
    - "Not usually."
    - "Never."
  state-dept: []
  freedom-house: []

v2juhccomp:
  description: "Compliance with high court"
  codebook_question: >-
    How often would you say the government complies with important
    decisions of the high court with which it disagrees?
  clarification: null
  categories:
    - "Never."
    - "Seldom."
    - "About half of the time."
    - "Usually."
    - "Always."
  state-dept: []
  freedom-house: []

v2juhcind:
  description: "High court independence"
  codebook_question: >-
    When the high court in the judicial system is ruling in cases that are
    salient to the government, how often would you say that it makes
    decisions that merely reflect government wishes regardless of its
    sincere view of the legal record?
  clarification: >-
    We are seeking to identify autonomous judicial decision-making and its
    absence. Decisions certainly can reflect government wishes without
    "merely reflecting" those wishes, i.e. a court can be autonomous when
    its decisions support the government's position. This is because a
    court can be fairly persuaded that the government's position is
    meritorious. By "merely reflect the wishes of the government" we mean
    that the court's own view of the record, its sincere evaluation of the
    record, is irrelevant to the outcome. The court simply adopts the
    government's position regardless of its sincere view of the record.
  categories:
    - "Always."
    - "Usually."
    - "About half of the time."
    - "Seldom."
    - "Never."
  state-dept: []
  freedom-house: []

v2juncind:
  description: "Lower court independence"
  codebook_question: >-
    When judges not on the high court are ruling in cases that are salient
    to the government, how often would you say that their decisions merely
    reflect government wishes regardless of their sincere view of the legal
    record?
  clarification: null
  categories:
    - "Always."
    - "Usually."
    - "About half of the time."
    - "Seldom."
    - "Never."
  state-dept: []
  freedom-house: []

v2jupack:
  description: "Court packing"
  codebook_question: >-
    The size of the judiciary is sometimes increased for very good reasons,
    as when judges are added to manage an increasing caseload; however,
    sometimes judges are added purely for political reasons. With this
    distinction in mind, please describe any increases in the size of the
    judiciary that occurred this calendar year.
  clarification: >-
    The second and third response categories permit you to distinguish
    among limited court packing efforts (i.e. when relatively few
    judgeships are added) by the political importance of the packing. For
    example, you may consider the packing of the high court to be more
    important than the packing of a lower court.
  categories:
    - >-
      There was a massive, politically motivated increase in the number of
      judgeships across the entire judiciary.
    - >-
      There was a limited, politically motivated increase in the number of
      judgeships on very important courts.
    - >-
      There was a limited, politically motivated increase in the number of
      judgeships.
    - >-
      Judgeships were added to the judiciary, but there is no evidence that
      the increase was politically motivated; or there was no increase.
  state-dept: []
  freedom-house: []

v2jupoatck:
  description: "Government attacks on judiciary"
  codebook_question: "How often did the government attack the judiciary's integrity in public?"
  clarification: >-
    Attacks on the judiciary's integrity can include claims that it is
    corrupt, incompetent or that decisions were politically motivated.
    These attacks can manifest in various ways including, but not limited
    to prepared statements reported by the media, press conferences,
    interviews, and stump speeches.
  categories:
    - "Attacks were carried out on a daily or weekly basis."
    - "Attacks were common and carried out in nearly every month of the year."
    - "Attacks occurred more than once."
    - "There were attacks, but they were rare."
    - "There were no attacks on the judiciary's integrity."
  state-dept: []
  freedom-house: []

v2jupurge:
  description: "Judicial purges"
  codebook_question: >-
    Judges are sometimes removed from their posts for cause, as when there
    is strong evidence of corruption; however, some judges are removed
    arbitrarily, typically for political reasons. With this distinction in
    mind, please describe the removal of judges that occurred this calendar
    year.
  clarification: >-
    The second and third response categories permit you to distinguish
    among limited arbitrary removals (i.e., when only a few judges are
    targeted) by the political importance of the removal. For example, you
    may consider the arbitrary removal of a few high court judges as more
    important than the arbitrary removal of a few lower court judges.
  categories:
    - "There was a massive, arbitrary purge of the judiciary."
    - "There were limited but very important arbitrary removals."
    - "There were limited arbitrary removals."
    - >-
      Judges were removed from office, but there is no evidence that the
      removals were arbitrary.
    - "Judges were not removed from their posts."
  state-dept: []
  freedom-house: []

v2jureform:
  description: "Judicial reform"
  codebook_question: >-
    Were the judiciary's formal powers altered this year in ways that
    affect its ability to control the arbitrary use of state authority?
  clarification: >-
    Evidence of this kind of reform could include the creation or removal
    of various forms of constitutional review, new rules increasing or
    decreasing access to the judiciary, changes in available judicial
    remedies, and any other formal institution (procedural or otherwise)
    that influences the ability of courts to control the arbitrary use of
    power.
  categories:
    - >-
      The judiciary's ability to control arbitrary power was reduced via
      institutional reform.
    - >-
      There was no change to the judiciary's ability to control arbitrary
      power via institutional review.
    - >-
      The judiciary's ability to control arbitrary power was enhanced via
      institutional reform.
  state-dept: []
  freedom-house: []

v2jureview:
  description: "Judicial review"
  codebook_question: >-
    Does any court in the judiciary have the legal authority to invalidate
    governmental policies (e.g. statutes, regulations, decrees,
    administrative actions) on the grounds that they violate a
    constitutional provision?
  clarification: null
  categories:
    - "No."
    - "Yes."
  state-dept: []
  freedom-house: []

v2mebias:
  description: "Media bias"
  codebook_question: "Is there media bias against opposition parties or candidates?"
  clarification: >-
    We ask you to take particular care in rating the year-to-year variation
    on this question if media bias tends to increase or decrease in
    election years. Coverage can be considered "more or less impartial"
    when the media as a whole present a mix of positive and negative
    coverage of each party or candidate.
  categories:
    - >-
      The print and broadcast media cover only the official party or
      candidates, or have no political coverage, or there are no opposition
      parties or candidates to cover.
    - >-
      The print and broadcast media cover more than just the official party
      or candidates but all the opposition parties or candidates receive
      only negative coverage.
    - >-
      The print and broadcast media cover some opposition parties or
      candidates more or less impartially, but they give only negative or
      no coverage to at least one newsworthy party or candidate.
    - >-
      The print and broadcast media cover opposition parties or candidates
      more or less impartially, but they give an exaggerated amount of
      coverage to the governing party or candidates.
    - >-
      The print and broadcast media cover all newsworthy parties and
      candidates more or less impartially and in proportion to their
      newsworthiness.
  state-dept: []
  freedom-house: []

v2mecenefi:
  description: "Internet censorship effort"
  codebook_question: >-
    Does the government attempt to censor information (text, audio, or
    visuals) on the Internet?
  clarification: >-
    Censorship attempts include Internet filtering (blocking access to
    certain websites or browsers), denial-of-service attacks, and partial
    or total Internet shutdowns. We are not concerned with censorship of
    topics such as child pornography, highly classified information such as
    military or intelligence secrets, statements offensive to a particular
    religion, or defamatory speech unless this sort of censorship is used
    as a pretext for censoring political information or opinions. We are
    also not concerned with the extent of internet access, unless there is
    absolutely no access at all (in which case the coding should be 0).
  categories:
    - >-
      The government successfully blocks Internet access except to sites
      that are pro-government or devoid of political content.
    - >-
      The government attempts to block Internet access except to sites that
      are pro-government or devoid of political content, but many users are
      able to circumvent such controls.
    - >-
      The government allows Internet access, including to some sites that
      are critical of the government, but blocks selected sites that deal
      with especially politically sensitive issues.
    - >-
      The government allows Internet access that is unrestricted, with the
      exceptions mentioned above.
  state-dept: []
  freedom-house: []

v2mecenefibin:
  description: "Internet binary"
  codebook_question: "Is there Internet in this country?"
  clarification: null
  categories:
    - "No."
    - "Yes."
  state-dept: []
  freedom-house: []

v2mecenefm:
  description: "Government censorship effort --- Media"
  codebook_question: >-
    Does the government directly or indirectly attempt to censor the print
    or broadcast media?
  clarification: >-
    Indirect forms of censorship might include politically motivated
    awarding of broadcast frequencies, withdrawal of financial support,
    influence over printing facilities and distribution networks, selected
    distribution of advertising, onerous registration requirements,
    prohibitive tariffs, and bribery. We are not concerned with censorship
    of non-political topics such as child pornography, statements offensive
    to a particular religion, or defamatory speech unless this sort of
    censorship is used as a pretext for censoring political speech.
  categories:
    - "Attempts to censor are direct and routine."
    - "Attempts to censor are indirect but nevertheless routine."
    - >-
      Attempts to censor are direct but limited to especially sensitive
      issues.
    - >-
      Attempts to censor are indirect and limited to especially sensitive
      issues.
    - >-
      The government rarely attempts to censor major media in any way, and
      when such exceptional attempts are discovered, the responsible
      officials are usually punished.
  state-dept: []
  freedom-house: []

v2mecorrpt:
  description: "Media corrupt"
  codebook_question: >-
    Do journalists, publishers, or broadcasters accept payments in exchange
    for altering news coverage?
  clarification: null
  categories:
    - >-
      The media are so closely directed by the government that any such
      payments would be either unnecessary to ensure pro-government
      coverage or ineffective in producing anti-government coverage.
    - >-
      Journalists, publishers, and broadcasters routinely alter news
      coverage in exchange for payments.
    - >-
      It is common, but not routine, for journalists, publishers, and
      broadcasters to alter news coverage in exchange for payments.
    - >-
      It is not normal for journalists, publishers, and broadcasters to
      alter news coverage in exchange for payments, but it happens
      occasionally, without anyone being punished.
    - >-
      Journalists, publishers, and broadcasters rarely alter news coverage
      in exchange for payments, and if it becomes known, someone is
      punished for it.
  state-dept: []
  freedom-house: []

v2mecrit:
  description: "Print/broadcast media critical"
  codebook_question: >-
    Of the major print and broadcast outlets, how many routinely criticize
    the government?
  clarification: null
  categories:
    - "None."
    - "Only a few marginal outlets."
    - >-
      Some important outlets routinely criticize the government but there
      are other important outlets that never do.
    - >-
      All major media outlets criticize the government at least
      occasionally.
  state-dept: []
  freedom-house: []

v2meharjrn:
  description: "Harassment of journalists"
  codebook_question: >-
    Are individual journalists harassed --- i.e., threatened with libel,
    arrested, imprisoned, beaten, or killed --- by governmental or powerful
    nongovernmental actors while engaged in legitimate journalistic
    activities?
  clarification: null
  categories:
    - >-
      No journalists dare to engage in journalistic activities that would
      offend powerful actors because harassment or worse would be certain
      to occur.
    - >-
      Some journalists occasionally offend powerful actors but they are
      almost always harassed or worse and eventually are forced to stop.
    - >-
      Some journalists who offend powerful actors are forced to stop but
      others manage to continue practicing journalism freely for long
      periods of time.
    - >-
      It is rare for any journalist to be harassed for offending powerful
      actors, and if this were to happen, those responsible for the
      harassment would be identified and punished.
    - >-
      Journalists are never harassed by governmental or powerful
      nongovernmental actors while engaged in legitimate journalistic
      activities.
  state-dept: []
  freedom-house: []

v2merange:
  description: "Print/broadcast media perspectives"
  codebook_question: >-
    Do the major print and broadcast media represent a wide range of
    political perspectives?
  clarification: null
  categories:
    - "The major media represent only the government's perspective."
    - >-
      The major media represent only the perspectives of the government and
      a government-approved, semi-official opposition party.
    - >-
      The major media represent a variety of political perspectives but
      they systematically ignore at least one political perspective that is
      important in this society.
    - >-
      All perspectives that are important in this society are represented
      in at least one of the major media.
  state-dept: []
  freedom-house: []

v2meslfcen:
  description: "Media self-censorship"
  codebook_question: >-
    Is there self-censorship among journalists when reporting on issues
    that the government considers politically sensitive?
  clarification: null
  categories:
    - "Self-censorship is complete and thorough."
    - "Self-censorship is common but incomplete."
    - >-
      There is self-censorship on a few highly sensitive political issues
      but not on moderately sensitive issues.
    - "There is little or no self-censorship among journalists."
  state-dept: []
  freedom-house: []

v2caassemb:
  description: "Freedom of peaceful assembly"
  codebook_question: >-
    To what extent do state authorities respect and protect the right of
    peaceful assembly?
  clarification: >-
    This question focuses on the ability to assemble publically in
    practice. An assembly is “an intentional and temporary presence of a
    number of individuals in a public place, for a common expressive
    purpose” (ODIHR and Venice Commission of the Council of Europe 2010).
    Authorities may limit the right to assembly only if limitations are
    necessary in the interests of national security or public safety,
    public order, the protection of public health or morals, or the
    protection of the rights and freedoms of others, and are lawful,
    necessary, and proportionate to the aim pursued. Such reasonable and
    legal restrictions should not be considered when answering. However, if
    there is evidence that restrictions are used as a pretext for political
    reasons, this evidence should be considered.
  categories:
    - >-
      Never. State authorities do not allow peaceful assemblies and are
      willing to use lethal force to prevent them.
    - >-
      Rarely. State authorities rarely allow peaceful assemblies, but
      generally avoid using lethal force to prevent them.
    - >-
      Sometimes. State authorities sometimes allow peaceful assemblies, but
      often arbitrarily deny citizens the right to assemble peacefully.
    - >-
      Mostly. State authorities generally allow peaceful assemblies, but in
      rare cases arbitrarily deny citizens the right to assemble
      peacefully.
    - >-
      Almost always. State authorities almost always allow and actively
      protect peaceful assemblies except in rare cases of lawful,
      necessary, and proportionate limitations.
  state-dept: []
  freedom-house: []

v2caautmob:
  description: "Mobilization for autocracy"
  codebook_question: >-
    In this year, how frequent and large have events of mass mobilization
    for pro-autocratic aims been?
  clarification: >-
    Events are pro-autocratic if they are organized explicitly in support
    of non-democratic rulers and forms of government such as a one-party
    state, monarchy, theocracy or military dictatorships. Events are also
    pro-autocratic if they are organized in support of leaders that
    question basic principles of democracy, or are generally aiming to
    undermine democratic ideas and institutions such as the rule of law,
    free and fair elections, or media freedom. This question concerns the
    mobilization of citizens for mass events such as demonstrations,
    strikes, sit-ins. These events are typically organized by non-state
    actors, but the question also concerns state-orchestrated rallies (e.g.
    to show support of an autocratic government).
  categories:
    - "There have been virtually no events."
    - "There have been several small-scale events."
    - "There have been many small-scale events."
    - "There have been several large-scale and small-scale events."
    - "There have been many large-scale and small-scale events."
  state-dept: []
  freedom-house: []

v2cacamps:
  description: "Political polarization"
  codebook_question: "Is society polarized into antagonistic, political camps?"
  clarification: >-
    Here we refer to the extent to which political differences affect
    social relationships beyond political discussions. Societies are highly
    polarized if supporters of opposing political camps are reluctant to
    engage in friendly interactions, for example, in family functions,
    civic associations, their free time activities and workplaces
  categories:
    - >-
      Not at all. Supporters of opposing political camps generally interact
      in a friendly manner.
    - >-
      Mainly not. Supporters of opposing political camps are more likely to
      interact in a friendly than a hostile manner.
    - >-
      Somewhat. Supporters of opposing political camps are equally likely
      to interact in a friendly or hostile manner.
    - >-
      Yes, to noticeable extent. Supporters of opposing political camps are
      more likely to interact in a hostile than friendly manner.
    - >-
      Yes, to a large extent. Supporters of opposing political camps
      generally interact in a hostile manner.
  state-dept: []
  freedom-house: []

v2caconmob:
  description: "Mass mobilization concentration"
  codebook_question: "Were mass mobilization events concentrated in the capital?"
  clarification: >-
    This question is about the geographic location of the events and not
    their intensity. In the unlikely event that no event at all took place,
    code option 2. This question concerns the mobilization of citizens for
    mass events such as demonstrations, strikes and sit-ins. These events
    are typically organized by non-state actors, but the question also
    concerns state-orchestrated rallies (e.g. to show support of an
    autocratic government).
  categories:
    - >-
      Yes. Events of mass mobilization were much more frequent in the
      capital.
    - >-
      Somewhat. Events of mass mobilization were somewhat more frequent in
      the capital.
    - >-
      No. Events of mass mobilization were as common in many cities across
      the country as in the capital or did not take place at all.
    - >-
      No. Events of mass mobilization were more common in cities other than
      the capital.
  state-dept: []
  freedom-house: []

v2cacritic:
  description: "Academics as critics"
  codebook_question: >-
    To what extent do scholars and university students publicly criticize
    government policies?
  clarification: >-
    This question is only about the extent scholars and students actually
    criticize government policies – irrespective of how free they are to do
    so and whether they are met with repression or not. We ask you simply
    to consider to what extent scholars and students are noticeable as
    government critics in the public discourse.  Public criticism of
    government policies can be conveyed for example through the publication
    of op-eds or social media posts on current affairs, the signing of open
    letters or petitions, the taking part in or organization of public
    protests, or the holding of critical lectures to students or the
    public.
  categories:
    - >-
      Not at all. Scholars and university students do not publicly express
      criticism of government policies.
    - >-
      To a small extent. Scholars and university students publicly express
      minor criticism of government policies.
    - >-
      To a moderate extent. Scholars and university students publicly
      express moderate criticism of government policies.
    - >-
      To a large extent. Scholars and university students publicly express
      substantive criticism of government policies.
    - >-
      To a major extent. Scholars and university students publicly express
      fundamental criticism of government policies.
  state-dept: []
  freedom-house: []

v2cademmob:
  description: "Mobilization for democracy"
  codebook_question: >-
    In this year, how frequent and large have events of mass mobilization
    for pro-democratic aims been?
  clarification: >-
    Events are pro-democratic if they are organized with the explicit aim
    to advance and/or protect democratic institutions such as free and fair
    elections with multiple parties, and courts and parliaments; or if they
    are in support of civil liberties such as freedom of association and
    speech. This question concerns the mobilization of citizens for mass
    events such as demonstrations, strikes and sit-ins.
  categories:
    - "There have been virtually no events."
    - "There have been several small-scale events."
    - "There have been many small-scale events."
    - "There have been several large-scale and small-scale events."
    - "There have been many large-scale and small-scale events."
  state-dept: []
  freedom-house: []

v2cagenmob:
  description: "Mass mobilization"
  codebook_question: >-
    In this year, how frequent and large have events of mass mobilization
    been?
  clarification: >-
    This question concerns the mobilization of citizens for mass events
    such as demonstrations, strikes and sit-ins. These events are typically
    organized by non-state actors, but the question also concerns
    state-orchestrated rallies (e.g. to show support of an autocratic
    government).
  categories:
    - "There have been virtually no events."
    - "There have been several small-scale events."
    - "There have been many small-scale events."
    - "There have been several large-scale and small-scale events."
    - "There have been many large-scale and small-scale events."
  state-dept: []
  freedom-house: []

v2cainsaut:
  description: "Institutional autonomy"
  codebook_question: >-
    To what extent do universities exercise institutional autonomy in
    practice?
  clarification: >-
    Institutional autonomy “means the independence of institutions of
    higher education from the State and all other forces of society, to
    make decisions regarding its internal government, finance,
    administration, and to establish its policies of education, research,
    extension work and other related activities” (Lima Declaration). Note
    that institutional autonomy does not preclude universities from
    accepting state or third party funding, but does require that they
    remain in charge of all types of decisions listed above. Institutional
    autonomy does also not preclude a public oversight role by the state
    over universities’ spending of public funds.
  categories:
    - >-
      No autonomy at all. Universities do not exercise any degree of
      institutional autonomy; non-academic actors control decision-making.
    - >-
      Minimal autonomy. Universities exercise only very limited
      institutional autonomy; non-academic actors interfere extensively
      with decision-making.
    - >-
      Moderate autonomy. Universities exercise some institutional autonomy;
      non-academic actors interfere moderately with decision-making.
    - >-
      Substantial autonomy. Universities exercise institutional autonomy to
      a large extent; non-academic actors have only rare and minimal
      influence on decision-making.
    - >-
      Complete autonomy. Universities exercise complete institutional
      autonomy from non-academic actors.
  state-dept: []
  freedom-house: []

v2canonpol:
  description: "Engagement in independent non-political associations"
  codebook_question: >-
    What share of the population is regularly active in independent
    non-political associations, such as sports clubs, literary societies,
    charities, fraternal groups, or support groups?
  clarification: >-
    Non-political associations include all associations whose main purpose
    is not the change of policy or practice at the state or societal level.
    It does NOT include political parties, or trade unions. An organization
    is independent if it is not controlled by the state or the ruling party
    and membership is voluntary. We consider an individual as active if
    they attend a meeting activity or event at least twice a year.
  categories:
    - "Virtually no one."
    - "A small share of the population (less than 5%)."
    - "A moderate share of the population (about 5 to 15 %)."
    - "A large share of the population (about 16 % to 25%)."
    - "A very large share of the population (about 26% or more)."
  state-dept: []
  freedom-house: []

v2capolit:
  description: "Engagement in independent political associations"
  codebook_question: >-
    What share of the population is regularly active in independent
    political interest associations, such as environmental associations,
    animal rights groups, or LGBT rights groups?
  clarification: >-
    Political associations include all associations whose main purpose is
    the change of policy or practice at the state or societal level. It
    does NOT include political parties or trade unions. An organization is
    independent if it is not controlled by the state or the ruling party
    and membership is voluntary. We consider an individual as active if
    they attend a meeting, activity or event at least twice a year.
  categories:
    - "Virtually no one."
    - "A small share of the population (less than 5%)."
    - "A moderate share of the population (about 5 to 15 %)."
    - "A large share of the population (about 16 % to 25%)."
    - "A very large share of the population (about 26% or more)."
  state-dept: []
  freedom-house: []

v2castate:
  description: "Engagement in state-administered mass organizations"
  codebook_question: >-
    What share of the population is regularly active in state-administered
    mass associations, such as women, worker or youth leagues?
  clarification: >-
    State-administered mass associations are civilian organizations created
    and led by the government or the ruling party. Large shares of specific
    societal groups are voluntary or compulsory members of these
    associations. Examples include youth leagues such as the Hitlerjugend
    in Nazi Germany and the pioneers in the Soviet Union, women leagues
    such as the Women’s Federation in China or the Federacion de Mujeres
    Cubanas and official trade unions in the Soviet Union. Such
    organizations are formally or informally affiliated with the state
    and/or with the ruling party. We consider an individual as active if
    they attend a meeting, activity or event at least twice a year.
  categories:
    - "Virtually no one."
    - "A small share of the population (less than 5%)."
    - "A moderate share of the population (about 5 to 15 %)."
    - "A large share of the population (about 16 % to 25%)."
    - "A very large share of the population (about 26% or more)."
  state-dept: []
  freedom-house: []

v2casurv:
  description: "Campus integrity"
  codebook_question: >-
    To what extent are campuses free from politically motivated
    surveillance or security infringements?
  clarification: >-
    “Campus” refers to all university buildings as well as digital research
    and teaching platforms. Campus integrity means the preservation of an
    open learning and research environment marked by an absence of an
    externally induced climate of insecurity or intimidation on campus.
    Examples of infringements of campus integrity are politically motivated
    on-campus or digital surveillance, presence by intelligence or security
    forces, presence of student militias, or violent attacks by third
    parties, if specifically targeting universities to repress academic
    life on campus. Note that we are only interested in politically
    motivated infringements and targeted attacks on campus integrity, not
    in non-political security concerns or proportionate security measures
    taken on campus to address these.
  categories:
    - >-
      Completely restricted. Campus integrity is fundamentally undermined
      by extensive surveillance and severe intimidation, including violence
      or closures.
    - >-
      Severely restricted. Campus integrity is to a large extent undermined
      by surveillance and intimidation, at times including violence or
      closures.
    - >-
      Moderately restricted. Campus integrity is challenged by some
      significant cases of surveillance or intimidation.
    - >-
      Mostly free. Campus integrity is to a large extent respected, with
      only minor cases of surveillance or intimidation.
    - >-
      Fully free. Campus integrity is comprehensively respected; there are
      no cases of surveillance or intimidation.
  state-dept: []
  freedom-house: []

v2catrauni:
  description: "Engagement in independent trade unions"
  codebook_question: >-
    What share of the population is regularly active in independent trade
    unions?
  clarification: >-
    An organization is independent if it is not controlled by the state or
    the ruling party and membership is voluntary. We consider an individual
    as active if they attend a meeting, activity or event at least twice a
    year.
  categories:
    - "Virtually no one."
    - "A small share of the population (less than 5%)."
    - "A moderate share of the population (about 5 to 15 %)."
    - "A large share of the population (about 16 % to 25%)."
    - "A very large share of the population (about 26% or more)."
  state-dept: []
  freedom-house: []

v2caviol:
  description: "Political violence"
  codebook_question: >-
    How often have non-state actors used political violence against persons
    this year?
  clarification: >-
    We understand political violence as the use of physical force to
    achieve political objectives by non-state actors. The restriction to
    political objectives excludes profit-driven crime-related violence, for
    instance. By non-state actors we refer to individuals or entities that
    are not formally part of the state. Thus, politically oriented militias
    and youth groups count as non-state actors even though they might
    potentially be informally affiliated with the ruling party or the
    state. Political violence against persons excludes psychological and
    symbolic violence (e.g. destruction of objects).
  categories:
    - "Not at all. Non-state actors did not use political violence."
    - "Rare. Non-state actors rarely used political violence."
    - "Occasionally. Non-state actors occasionally used political violence."
    - "Frequently. Non-state actors frequently used political violence."
    - "Often. Non-state actors often used political violence."
  state-dept: []
  freedom-house: []

v2exbribe:
  description: "Executive bribery and corrupt exchanges"
  codebook_question: >-
    How routinely do members of the executive (the head of state, the head
    of government, and cabinet ministers), or their agents, grant favors in
    exchange for bribes, kickbacks, or other material inducements?
  clarification: null
  categories:
    - "It is routine and expected."
    - "It happens more often than not in dealings with the executive."
    - >-
      It happens but is unpredictable: those dealing with the executive
      find it hard to predict when an inducement will be necessary.
    - "It happens occasionally but is not expected."
    - "It never, or hardly ever, happens."
  state-dept: []
  freedom-house: []

v2excrptps:
  description: "Public sector corrupt exchanges"
  codebook_question: >-
    How routinely do public sector employees grant favors in exchange for
    bribes, kickbacks, or other material inducements?
  clarification: >-
    When responding to this question, we would like to you think about a
    typical person employed by the public sector, excluding the military.
    If you think there are large discrepancies between branches of the
    public sector, between the national/federal and subnational/state
    level, or between the core bureaucracy and employees working with
    public service delivery, please try to average them out before stating
    your response.
  categories:
    - >-
      Extremely common. Most public sector employees are systematically
      involved in petty but corrupt exchanges almost all the time.
    - >-
      Common. Such petty but corrupt exchanges occur regularly involving a
      majority of public employees.
    - >-
      Sometimes. About half or less than half of public sector employees
      engage in such exchanges for petty gains at times.
    - >-
      Scattered. A small minority of public sector employees engage in
      petty corruption from time to time.
    - "No. Never, or hardly ever."
  state-dept: []
  freedom-house: []

v2exdfcbhs:
  description: "HOS appoints cabinet in practice"
  codebook_question: >-
    In practice, does the head of state have the power to appoint --- or is
    the approval of the head of state necessary for the appointment of ---
    cabinet ministers?
  clarification: >-
    The question refers to whether the head of state is considered to hold
    this power in practice, regardless of whether this is regulated by law
    and whether this power has been exercised or not. If confirmation of
    the legislature is needed, this should be coded as such also when the
    HOS controls the majority of the legislature ("tacit consent").
    Moreover, by the "legislature" in this case, we mean either house of
    the legislature (in the case of bicameralism).
  categories:
    - "No."
    - >-
      Yes, but only with respect to the head of the cabinet, and only with
      the tacit consent or explicit confirmation by the legislature.
    - >-
      Yes, but only with the tacit consent or explicit confirmation by the
      legislature.
    - >-
      Yes, without any need for confirmation by the legislature, but only
      with respect to the head of the cabinet.
    - "Yes, without any need for confirmation by the legislature."
  state-dept: []
  freedom-house: []

v2exdfdmhs:
  description: "HOS dismisses ministers in practice"
  codebook_question: >-
    If the head of state took actions to dismiss cabinet ministers, would
    he/she be likely to succeed?
  clarification: >-
    The question refers to whether the head of state is considered to hold
    this power in practice, regardless of whether this is regulated by law
    and whether this power has been exercised or not, and regardless of
    possible political repercussions (e.g., vote of no confidence).
  categories:
    - "No."
    - >-
      Yes, but not at his/her own discretion, only when prompted to as a
      response to specific events (for example, after a vote of no
      confidence taken by the legislature).
    - >-
      Yes, at his/her own discretion, but with restrictions (for example,
      only provided the head of state proposes an alternative minister who
      would need the legislature's approval, i.e., so called ''constructive
      dismissal'').
    - "Yes, at his/her own discretion and without restrictions."
  state-dept: []
  freedom-house: []

v2exdfdshg:
  description: "HOG dismisses ministers in practice"
  codebook_question: >-
    If the head of government took actions to dismiss cabinet ministers,
    would he/she be likely to succeed?
  clarification: >-
    The question refers to whether the head of government is considered to
    hold this power in practice, regardless of whether this is regulated by
    law and whether this power has been exercised or not, and regardless of
    possible political repercussions (e.g., vote of no confidence).
  categories:
    - "No."
    - >-
      Yes, but not at his/her own discretion, only when prompted to as a
      response to specific events (for example, after a vote of no
      confidence taken by the legislature).
    - >-
      Yes, at his/her own discretion, but with restrictions (for example,
      only provided the head of government proposes an alternative minister
      who would need the legislature's approval , i.e., so called
      ''constructive dismissal'').
    - "Yes, at his/her own discretion and without restrictions."
  state-dept: []
  freedom-house: []

v2exdfdshs:
  description: "HOS dissolution in practice"
  codebook_question: >-
    If the head of state took actions to dissolve the legislature, would
    he/she be likely to succeed?
  clarification: >-
    The question refers to whether the head of state is considered to hold
    this power in practice, regardless of whether this is regulated by law
    and whether this power has been exercised or not. By "dissolving the
    legislature" we refer to the ability of the head of state to call a new
    election for the legislature.
  categories:
    - "No."
    - >-
      Yes, but not at his/her own discretion, only when prompted to as a
      response to specific events (for example, after a certain number of
      votes of no confidence, or after a certain number of failed attempts
      to form a cabinet).
    - >-
      Yes, at his/her own discretion, but with restrictions (for example,
      by frequency, such as ''once a year'', by time point within term,
      such as ''not within the last sixth months of the head of state's
      term'', and by the requirement that the head of state must then
      himself/herself stand for election).
    - "Yes, at his/her own discretion and without restrictions."
  state-dept: []
  freedom-house: []

v2exdfpphg:
  description: "HOG proposes legislation in practice"
  codebook_question: >-
    Does the head of government have the capacity, in practice, to propose
    legislation?
  clarification: >-
    By ''propose legislation'', we mean the introduction of legislative
    bills. The question refers to whether the head of government is
    considered to hold this power in practice, regardless of whether this
    is regulated by law and whether this power has been exercised or not.
  categories:
    - >-
      Yes, in all policy areas, including some exclusive domains (where
      neither the legislature nor other bodies may initiate bills).
    - >-
      Yes, in all policy areas, but this power is shared with the
      legislature and perhaps with other bodies.
    - "No. The head of government cannot propose legislation."
  state-dept: []
  freedom-house: []

v2exdfpphs:
  description: "HOS proposes legislation in practice"
  codebook_question: >-
    Does the head of state have the capacity, in practice, to propose
    legislation?
  clarification: >-
    By ''propose legislation'', we mean the introduction of legislative
