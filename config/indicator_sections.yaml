v2strenadm:
  held_out: true
  description: "Bureaucratic remuneration"
  codebook_question: "To what extent are state administrators salaried employees?"
  clarification: >-
    A state administrator is anyone who works for the state administration.
    By "salaried employee", we mean someone who is employed on a contract
    and paid a regular allowance directly out of the state coffers. It does
    not include unpaid work; work paid for through a private collection of
    fees, material perquisites or bribes; private employment by a
    higher-ranking "patron" within the administration; contractors being
    paid on an irregular basis; or "parastatals" (those working for
    state-owned companies), since the latter are not paid directly out of
    the state coffers. Note that the question refers to the practices
    obtaining in the state administration, excluding the armed forces.
  categories:
    - "None or almost none are salaried state employees."
    - "A small share is salaried state employees."
    - "About half are salaried state employees."
    - "A substantial number are salaried state employees."
    - "All or almost all are salaried state employees."
  state-dept: []
  freedom-house: []

