# config/indicator_sections.yaml
#
# Per-indicator codebook text and source document section mappings for the
# panel-member pipeline. Loaded by pipeline/assemble_prompt.py.
#
# Codebook text generated by config/generate_indicator_yaml.R from vdemdata::codebook
# (V-Dem v15). Do not edit the description, codebook_question, clarification, or
# categories fields manually — re-run the script if corrections are needed.
#
# held_out: true — marks weak-coverage indicators (fewer than 6 median coders per
# country in 2020). These are excluded from fine-tuning training data by
# prepare_finetune_data.py but remain available for prompting experiments (evidence
# and codebook conditions). They serve two evaluation purposes:
#   1. Transfer test: does the fine-tuned model generalize to indicators it was not
#      trained on?
#   2. Prompting baseline: how does few-shot prompting perform on thin-coverage
#      indicators compared to well-covered ones?
#
# Section mappings (state-dept, freedom-house) must be filled in manually.
# See config/indicator_section_mapping.csv for module-level defaults as a starting
# point.
#
# State Dept section keys:
#   1a: Arbitrary/unlawful deprivation of life
#   1b: Disappearance
#   1c: Torture and cruel, inhuman, or degrading treatment
#   1d: Arbitrary arrest or detention
#   1e: Denial of fair public trial
#   1f: Arbitrary interference with privacy
#   1g: Abuses in internal conflict
#   2a: Freedom of expression, including for the press and internet
#   2b: Freedoms of peaceful assembly and association
#   2c: Freedom of religion
#   2d: Freedom of movement
#   3:  Freedom to participate in the political process
#   4:  Corruption and lack of transparency in government
#   5:  Governmental attitude toward international and NGO scrutiny
#   6:  Discrimination, societal abuses, and trafficking in persons
#   7a–7e: Worker rights subsections
#
# Freedom House section keys: A (Electoral Process), B (Political Pluralism),
#   C (Functioning of Government), D (Freedom of Expression), E (Associational
#   Rights), F (Rule of Law), G (Personal Autonomy)

v2cafexch:
  description: "Freedom of academic exchange and dissemination"
  codebook_question: >-
    To what extent are scholars free to exchange and communicate research
    ideas and findings?
  clarification: >-
    Free academic exchange includes uncensored access to research material,
    unhindered participation in national or international academic
    conferences, and the uncensored publication of academic material. Free
    dissemination refers to the unrestricted possibility for scholars to
    share and explain research findings in their field of expertise to
    non-academic audiences through media engagement or public lectures.
  categories:
    - >-
      Completely restricted. Academic exchange and dissemination is, across
      all disciplines, consistently subject to censorship, self-censorship
      or other restrictions.
    - >-
      Severely restricted. Academic exchange and dissemination is, in some
      disciplines, consistently subject to censorship, self-censorship or
      other restrictions.
    - >-
      Moderately restricted. Academic exchange and dissemination is
      occasionally subject to censorship, self-censorship or other
      restrictions.
    - >-
      Mostly free. Academic exchange and dissemination is rarely subject to
      censorship, self-censorship or other restrictions.
    - >-
      Fully free. Academic exchange and dissemination is not subject to
      censorship, self-censorship or other restrictions.
  state-dept: []
  freedom-house: []

v2cafres:
  description: "Freedom to research and teach"
  codebook_question: >-
    To what extent are scholars free to develop and pursue their own
    research and teaching agendas without interference?
  clarification: >-
    Examples of interference include research agendas or teaching curricula
    being drafted, restricted, or fully censored by a non-academic actor;
    scholars being externally induced, through possible reprisals, to
    self-censor; or the university administration abusing its position of
    power to impose research or teaching agendas on individual academics.
    It also includes public pressure on academics - offline and online. We
    do not consider as interference restrictions that are due to research
    priorities, as well as ethical and quality standards, freely defined by
    the scholarly community as well as the development of standardized
    curricula by academics that aim to structure and enhance teaching.
  categories:
    - >-
      Completely restricted. When determining their research agenda or
      teaching curricula, scholars are, across all disciplines,
      consistently subject to interference or incentivized to self-censor.
    - >-
      Severely restricted. When determining their research agenda or
      teaching curricula, scholars are, in some disciplines, consistently
      subject to interference or incentivized to self-censor.
    - >-
      Moderately restricted. When determining their research agenda or
      teaching curricula, scholars are occasionally subject to interference
      or incentivized to self-censor.
    - >-
      Mostly free. When determining their research agenda or teaching
      curricula, scholars are rarely subject to interference or
      incentivized to self-censor.
    - >-
      Fully free. When determining their research agenda or teaching
      curricula, scholars are not subject to interference or incentivized
      to self-censor.
  state-dept: []
  freedom-house: []

v2clacfree:
  description: "Freedom of academic and cultural expression"
  codebook_question: >-
    Is there academic freedom and freedom of cultural expression related to
    political issues?
  clarification: null
  categories:
    - >-
      Not respected by public authorities. Censorship and intimidation are
      frequent. Academic activities and cultural expressions are severely
      restricted or controlled by the government.
    - >-
      Weakly respected by public authorities. Academic freedom and freedom
      of cultural expression are practiced occasionally, but direct
      criticism of the government is mostly met with repression.
    - >-
      Somewhat respected by public authorities. Academic freedom and
      freedom of cultural expression are practiced routinely, but strong
      criticism of the government is sometimes met with repression.
    - >-
      Mostly respected by public authorities. There are few limitations on
      academic freedom and freedom of cultural expression, and resulting
      sanctions tend to be infrequent and soft.
    - >-
      Fully respected by public authorities. There are no restrictions on
      academic freedom or cultural expression.
  state-dept: []
  freedom-house: []

v2clacjstm:
  description: "Access to justice for men"
  codebook_question: "Do men enjoy secure and effective access to justice?"
  clarification: >-
    This question specifies the extent to which men can bring cases before
    the courts without risk to their personal safety, trials are fair, and
    men have effective ability to seek redress if public authorities
    violate their rights, including the rights to counsel, defense, and
    appeal. This question does not ask you to assess the relative access to
    justice men and women. Thus, it is possible to assign the lowest
    possible score to a country even if men and women enjoy equal --- and
    extremely limited --- access to justice.
  categories:
    - "Secure and effective access to justice for men is non-existent."
    - >-
      Secure and effective access to justice for men is usually not
      established or widely respected.
    - >-
      Secure and effective access to justice for men is inconsistently
      observed. Minor problems characterize most cases or occur rather
      unevenly across different parts of the country.
    - "Secure and effective access to justice for men is usually observed."
    - >-
      Secure and effective access to justice for men is almost always
      observed.
  state-dept: []
  freedom-house: []

v2clacjstw:
  description: "Access to justice for women"
  codebook_question: "Do women enjoy equal, secure, and effective access to justice?"
  clarification: >-
    This question specifies the extent to which women can bring cases
    before the courts without risk to their personal safety, trials are
    fair, and women have effective ability to seek redress if public
    authorities violate their rights, including the rights to counsel,
    defense, and appeal. This question does not ask you to assess the
    relative access to justice men and women. Thus, it is possible to
    assign the lowest possible score to a country even if men and women
    enjoy equal --- and extremely limited --- access to justice.
  categories:
    - "Secure and effective access to justice for women is non-existent."
    - >-
      Secure and effective access to justice for women is usually not
      established or widely respected.
    - >-
      Secure and effective access to justice for women is inconsistently
      observed. Minor problems characterize most cases or occur rather
      unevenly across different parts of the country.
    - "Secure and effective access to justice for women is usually observed."
    - >-
      Secure and effective access to justice for women is almost always
      observed.
  state-dept: []
  freedom-house: []

v2clacjust:
  description: "Social class equality in respect for civil liberty"
  codebook_question: >-
    Do poor people enjoy the same level of civil liberties as rich people
    do?
  clarification: >-
    This question specifies the extent to which the level of civil
    liberties is generally the same across socioeconomic groups so that
    people with a low social status are not treated worse than people with
    high social status. Here, civil liberties are understood to include
    access to justice, private property rights, freedom of movement, and
    freedom from forced labor.
  categories:
    - "Poor people enjoy much fewer civil liberties than rich people."
    - >-
      Poor people enjoy substantially fewer civil liberties than rich
      people.
    - "Poor people enjoy moderately fewer civil liberties than rich people."
    - "Poor people enjoy slightly fewer civil liberties than rich people."
    - "Poor people enjoy the same level of civil liberties as rich people."
  state-dept: []
  freedom-house: []

v2cldiscm:
  description: "Freedom of discussion for men"
  codebook_question: >-
    Are men able to openly discuss political issues in private homes and in
    public spaces?
  clarification: >-
    This indicator specifies the extent to which men are able to engage in
    private discussions, particularly on political issues, in private homes
    and public spaces (restaurants, public transportation, sports events,
    work etc.) without fear of harassment by other members of the polity or
    the public authorities. We are interested in restrictions by the
    government and its agents but also cultural restrictions or customary
    laws that are enforced by other members of the polity, sometimes in
    informal ways. This question does not ask you to assess the relative
    freedom of men and women. Thus, it is possible to assign the lowest
    possible score to a country even if men and women enjoy equal --- and
    extremely low --- rights to freedom of discussion.
  categories:
    - >-
      Not respected. Hardly any freedom of expression exists for men. Men
      are subject to immediate and harsh intervention and harassment for
      expression of political opinion.
    - >-
      Weakly respected. Expressions of political opinions by men are
      frequently exposed to intervention and harassment.
    - >-
      Somewhat respected. Expressions of political opinions by men are
      occasionally exposed to intervention and harassment.
    - >-
      Mostly respected. There are minor restraints on the freedom of
      expression in the private sphere, predominantly limited to a few
      isolated cases or only linked to soft sanctions. But as a rule there
      is no intervention or harassment if men make political statements.
    - >-
      Fully respected. Freedom of speech for men in their homes and in
      public spaces is not restricted.
  state-dept: []
  freedom-house: []

v2cldiscw:
  description: "Freedom of discussion for women"
  codebook_question: >-
    Are women able to openly discuss political issues in private homes and
    in public spaces?
  clarification: >-
    This indicator specifies the extent to which women are able to engage
    in private discussions, particularly on political issues, in private
    homes and public spaces (restaurants, public transportation, sports
    events, work etc.) without fear of harassment by other members of the
    polity or the public authorities. We are interested in restrictions by
    the government and its agents but also cultural restrictions or
    customary laws that are enforced by other members of the polity,
    sometimes in informal ways. This question does not ask you to assess
    the relative freedom of men and women. Thus, it is possible to assign
    the lowest possible score to a country even if men and women enjoy
    equal --- and extremely low --- rights to freedom of discussion.
  categories:
    - >-
      Not respected. Hardly any freedom of expression exists for women.
      Women are subject to immediate and harsh intervention and harassment
      for expression of political opinion.
    - >-
      Weakly respected. Expressions of political opinions by women are
      frequently exposed to intervention and harassment.
    - >-
      Somewhat respected. Expressions of political opinions by women are
      occasionally exposed to intervention and harassment.
    - >-
      Mostly respected. There are minor restraints on the freedom of
      expression in the private sphere, predominantly limited to a few
      isolated cases or only linked to soft sanctions. But as a rule there
      is no intervention or harassment if women make political statements.
    - >-
      Fully respected. Freedom of speech by women in their homes and in
      public spaces is not restricted.
  state-dept: []
  freedom-house: []

v2cldmovem:
  description: "Freedom of domestic movement for men"
  codebook_question: "Do men enjoy freedom of movement within the country?"
  clarification: >-
    This indicator specifies the extent to which all men are able to move
    freely, in daytime and nighttime, in public thoroughfares, across
    regions within a country, and to establish permanent residency where
    they wish. Note that restrictions in movement might be imposed by the
    state and/or by informal norms and practices. Such restrictions
    sometimes fall on rural residents, on specific social groups, or on
    dissidents.  This question does not ask you to assess the relative
    freedom of men and women. Thus, it is possible to assign the lowest
    possible score to a country even if men and women enjoy equal --- and
    extremely low --- freedom of movement. Do not consider restrictions in
    movement that are placed on ordinary (non-political) criminals. Do not
    consider restrictions in movement that result from crime or unrest.
  categories:
    - "Virtually no men enjoy full freedom of movement (e.g., North Korea)."
    - >-
      Some men enjoy full freedom of movement, but most do not (e.g.,
      Apartheid South Africa).
    - >-
      Most men enjoy some freedom of movement but a sizeable minority does
      not. Alternatively all men enjoy partial freedom of movement.
    - "Most men enjoy full freedom of movement but a small minority does not."
    - "Virtually all men enjoy full freedom of movement."
  state-dept: []
  freedom-house: []

v2cldmovew:
  description: "Freedom of domestic movement for women"
  codebook_question: "Do women enjoy freedom of movement within the country?"
  clarification: >-
    This indicator specifies the extent to which all women are able to move
    freely, in daytime and nighttime, in public thoroughfares, across
    regions within a country, and to establish permanent residency where
    they wish. Note that restrictions in movement might be imposed by the
    state and/or by informal norms and practices. Such restrictions
    sometimes fall on rural residents, on specific social groups, or on
    dissidents.  This question does not ask you to assess the relative
    freedom of men and women. Thus, it is possible to assign the lowest
    possible score to a country even if men and women enjoy equal --- and
    extremely low --- freedom of movement. Do not consider restrictions in
    movement that are placed on ordinary (non-political) criminals. Do not
    consider restrictions in movement that result from crime or unrest.
  categories:
    - >-
      Virtually no women enjoy full freedom of movement (e.g., North Korea
      or Afghanistan under the Taliban).
    - >-
      Some women enjoy full freedom of movement, but most do not (e.g.,
      Apartheid South Africa).
    - >-
      Most women enjoy some freedom of movement but a sizeable minority
      does not. Alternatively all women enjoy partial freedom of movement.
    - >-
      Most women enjoy full freedom of movement but a small minority does
      not.
    - "Virtually all women enjoy full freedom of movement."
  state-dept: []
  freedom-house: []

v2clfmove:
  description: "Freedom of foreign movement"
  codebook_question: "Is there freedom of foreign travel and emigration?"
  clarification: >-
    This indicator specifies the extent to which citizens are able to
    travel freely to and from the country and to emigrate without being
    subject to restrictions by public authorities.
  categories:
    - >-
      Not respected by public authorities. Citizens are rarely allowed to
      emigrate or travel out of the country. Transgressors (or their
      families) are severely punished. People discredited by the public
      authorities are routinely exiled or prohibited from traveling.
    - >-
      Weakly respected by public authorities. The public authorities
      systematically restrict the right to travel, especially for political
      opponents or particular social groups. This can take the form of
      general restrictions on the duration of stays abroad or
      delays/refusals of visas.
    - >-
      Somewhat respected by the public authorities. The right to travel for
      leading political opponents or particular social groups is
      occasionally restricted but ordinary citizens only met minor
      restrictions.
    - >-
      Mostly respected by public authorities. Limitations on freedom of
      movement and residence are not directed at political opponents but
      minor restrictions exist. For example, exit visas may be required and
      citizens may be prohibited from traveling outside the country when
      accompanied by other members of their family.
    - >-
      Fully respected by the government. The freedom of citizens to travel
      from and to the country, and to emigrate and repatriate, is not
      restricted by public authorities.
  state-dept: []
  freedom-house: []

v2clgencl:
  description: "Gender equality in respect for civil liberties"
  codebook_question: "Do women enjoy the same level of civil liberties as men?"
  clarification: >-
    Here, civil liberties are understood to include access to justice,
    private property rights, freedom of movement, and freedom from forced
    labor.
  categories:
    - "Women enjoy much fewer civil liberties than men."
    - "Women enjoy substantially fewer civil liberties than men."
    - "Women enjoy moderately fewer civil liberties than men."
    - "Women enjoy slightly fewer civil liberties than men."
    - "Women enjoy the same level of civil liberties as men."
  state-dept: []
  freedom-house: []

v2clgeocl:
  description: "Urban-rural location equality in respect for civil liberties"
  codebook_question: >-
    Do those who reside in rural areas enjoy same level of civil liberties
    as those residing in urban areas?
  clarification: >-
    This question specifies the extent to which the level of civil
    liberties is generally the same across geographic areas. Urban areas
    are defined as an area that meets the following conditions: population
    density exceeds a threshold of 150 persons per square kilometer, there
    is access to a sizeable settlement of 50,000 people or more within some
    reasonable travel time, for example 60 minutes by road (World
    Development Report, 2009: 54).  Here, civil liberties are understood to
    include access to justice, private property rights, freedom of
    movement, and freedom from forced labor.
  categories:
    - >-
      Those who live in rural areas enjoy much fewer civil liberties than
      residents of urban areas.
    - >-
      Those who live in rural areas enjoy substantially fewer civil
      liberties than residents of urban areas.
    - >-
      Those who live in rural areas enjoy moderately fewer civil liberties
      than residents of urban areas.
    - >-
      Those who live in rural areas enjoy slightly fewer civil liberties
      than residents of urban areas.
    - >-
      Residents of rural areas enjoy the same level of civil liberties as
      those in urban areas.  5: Residents of rural areas enjoy more civil
      liberties than those in urban areas.
  state-dept: []
  freedom-house: []

v2clkill:
  description: "Freedom from political killings"
  codebook_question: "Is there freedom from political killings?"
  clarification: >-
    Political killings are killings by the state or its agents without due
    process of law for the purpose of eliminating political opponents.
    These killings are the result of deliberate use of lethal force by the
    police, security forces, prison officials, or other agents of the state
    (including paramilitary groups).
  categories:
    - >-
      Not respected by public authorities. Political killings are practiced
      systematically and they are typically incited and approved by top
      leaders of government.
    - >-
      Weakly respected by public authorities. Political killings are
      practiced frequently and top leaders of government are not actively
      working to prevent them.
    - >-
      Somewhat respected by public authorities. Political killings are
      practiced occasionally but they are typically not incited and
      approved by top leaders of government.
    - >-
      Mostly respected by public authorities. Political killings are
      practiced in a few isolated cases but they are not incited or
      approved by top leaders of government.
    - >-
      Fully respected by public authorities. Political killings are
      non-existent.
  state-dept: []
  freedom-house: []

v2clpolcl:
  description: "Political group equality in respect for civil liberties"
  codebook_question: >-
    Do members of all political groups enjoy the same level of civil
    liberties, or are some groups generally in a more favorable position?
  clarification: >-
    A political group is defined as those who are affiliated with a
    particular political party or candidate, or a group of
    parties/candidates that can be distinguished from others in terms of
    enjoyment of civil liberties. Responses should not reflect which party
    controls the legislature and executive. Here, civil liberties are
    understood to include access to justice, private property rights,
    freedom of movement, and freedom from forced labor.
  categories:
    - >-
      Some political groups enjoy much fewer civil liberties than other
      political groups.
    - >-
      Some political groups enjoy substantially fewer civil liberties than
      other political groups.
    - >-
      Some political groups enjoy moderately fewer civil liberties than
      other political groups.
    - >-
      Some political groups enjoy slightly fewer civil liberties than other
      political groups.
    - "All political groups enjoy the same level of civil liberties."
  state-dept: []
  freedom-house: []

v2clprptym:
  description: "Property rights for men"
  codebook_question: "Do men enjoy the right to private property?"
  clarification: >-
    Private property includes the right to acquire, possess, inherit, and
    sell private property, including land. Limits on property rights may
    come from the state (which may legally limit rights or fail to enforce
    them); customary laws and practices; or religious or social norms. This
    question concerns the right to private property, not actual ownership
    of property. This question does not ask you to assess the relative
    rights of men and women. Thus, it is possible to assign the lowest
    possible score to a country even if men and women enjoy equal --- and
    very minimal --- property rights.
  categories:
    - "Virtually no men enjoy private property rights of any kind."
    - "Some men enjoy some private property rights, but most have none."
    - >-
      Many men enjoy many private property rights, but a smaller proportion
      enjoys few or none.
    - >-
      More than half of men enjoy most private property rights, yet a
      smaller share of men have much more restricted rights.
    - >-
      Most men enjoy most private property rights but a small minority does
      not.  5: Virtually all men enjoy all, or almost all property rights.
  state-dept: []
  freedom-house: []

v2clprptyw:
  description: "Property rights for women"
  codebook_question: "Do women enjoy the right to private property?"
  clarification: >-
    Private property includes the right to acquire, possess, inherit, and
    sell private property, including land. Limits on property rights may
    come from the state (which may legally limit rights or fail to enforce
    them); customary laws and practices; or religious or social norms. This
    question concerns the right to private property, not actual ownership
    of property. This question does not ask you to assess the relative
    rights of men and women. Thus, it is possible to assign the lowest
    possible score to a country even if men and women enjoy equal --- and
    very minimal --- property rights.
  categories:
    - "Virtually no women enjoy private property rights of any kind."
    - "Some women enjoy some private property rights, but most have none."
    - >-
      Many women enjoy many private property rights, but a smaller
      proportion enjoys few or none.
    - >-
      More than half of women enjoy most private property rights, yet a
      smaller share of women have much more restricted rights.
    - >-
      Most women enjoy most private property rights but a small minority
      does not.  5: Virtually all women enjoy all, or almost all, property
      rights.
  state-dept: []
  freedom-house: []

v2clrelig:
  description: "Freedom of religion"
  codebook_question: "Is there freedom of religion?"
  clarification: >-
    This indicator specifies the extent to which individuals and groups
    have the right to choose a religion, change their religion, and
    practice that religion in private or in public as well as to
    proselytize peacefully without being subject to restrictions by public
    authorities.
  categories:
    - >-
      Not respected by public authorities. Hardly any freedom of religion
      exists. Any kind of religious practice is outlawed or at least
      controlled by the government to the extent that religious leaders are
      appointed by and subjected to public authorities, who control the
      activities of religious communities in some detail.
    - >-
      Weakly respected by public authorities. Some elements of autonomous
      organized religious practices exist and are officially recognized.
      But significant religious communities are repressed, prohibited, or
      systematically disabled, voluntary conversions are restricted, and
      instances of discrimination or intimidation of individuals or groups
      due to their religion are common.
    - >-
      Somewhat respected by public authorities. Autonomous organized
      religious practices exist and are officially recognized. Yet, minor
      religious communities are repressed, prohibited, or systematically
      disabled, and/or instances of discrimination or intimidation of
      individuals or groups due to their religion occur occasionally.
    - >-
      Mostly respected by public authorities. There are minor restrictions
      on the freedom of religion, predominantly limited to a few isolated
      cases. Minority religions face denial of registration, hindrance of
      foreign missionaries from entering the country, restrictions against
      proselytizing, or hindrance to access to or construction of places of
      worship.
    - >-
      Fully respected by public authorities. The population enjoys the
      right to practice any religious belief they choose. Religious groups
      may organize, select, and train personnel; solicit and receive
      contributions; publish; and engage in consultations without undue
      interference. If religious communities have to register, public
      authorities do not abuse the process to discriminate against a
      religion and do not constrain the right to worship before
      registration.
  state-dept: []
  freedom-house: []

v2clrgunev:
  description: "Subnational civil liberties unevenness"
  codebook_question: >-
    Does government respect for civil liberties vary across different areas
    of the country?
  clarification: null
  categories:
    - >-
      Yes. Government officials in some areas of the country respect civil
      liberties significantly more (or, alternatively, significantly less)
      than government officials in other areas of the country.
    - >-
      Somewhat. Government officials in some areas of the country respect
      civil liberties somewhat more (or, alternatively, somewhat less) than
      government officials in other areas of the country.
    - >-
      No. Government officials in most or all areas of the country equally
      respect (or, alternatively, equally do not respect) civil liberties.
  state-dept: []
  freedom-house: []

v2clrspct:
  description: "Rigorous and impartial public administration"
  codebook_question: >-
    Are public officials rigorous and impartial in the performance of their
    duties?
  clarification: >-
    This question focuses on the extent to which public officials generally
    abide by the law and treat like cases alike, or conversely, the extent
    to which public administration is characterized by arbitrariness and
    biases (i.e., nepotism, cronyism, or discrimination).  The question
    covers the public officials that handle the cases of ordinary people.
    If no functioning public administration exists, the lowest score (0)
    applies.
  categories:
    - >-
      The law is not respected by public officials. Arbitrary or biased
      administration of the law is rampant.
    - >-
      The law is weakly respected by public officials. Arbitrary or biased
      administration of the law is widespread.
    - >-
      The law is modestly respected by public officials. Arbitrary or
      biased administration of the law is moderate.
    - >-
      The law is mostly respected by public officials. Arbitrary or biased
      administration of the law is limited.
    - >-
      The law is generally fully respected by the public officials.
      Arbitrary or biased administration of the law is very limited.
  state-dept: []
  freedom-house: []

v2clslavef:
  description: "Freedom from forced labor for women"
  codebook_question: "Are adult women free from servitude and other kinds of forced labor?"
  clarification: >-
    Involuntary servitude occurs when an adult is unable to quit a job s/he
    desires to leave --- not by reason of economic necessity but rather by
    reason of employer's coercion. This includes labor camps but not work
    or service which forms part of normal civic obligations such as
    conscription or employment in command economies.  This question does
    not ask you to assess the relative freedom of men and women from forced
    labor. Thus, a country in which both men and women suffer the same
    conditions of servitude might be coded a (0) for women, even though
    there is equality across the sexes.
  categories:
    - >-
      Female servitude or other kinds of forced labor is widespread and
      accepted (perhaps even organized) by the state.
    - >-
      Female servitude or other kinds of forced labor is substantial.
      Although officially opposed by the public authorities, the state is
      unwilling or unable to effectively contain the practice.
    - >-
      Female servitude or other kinds of forced labor exists but is not
      widespread and usually actively opposed by public authorities, or
      only tolerated in some particular areas or among particular social
      groups.
    - >-
      Female servitude or other kinds of forced labor is infrequent and
      only found in the criminal underground. It is actively and sincerely
      opposed by the public authorities.
    - >-
      Female servitude or other kinds of forced labor is virtually
      non-existent.
  state-dept: []
  freedom-house: []

v2clslavem:
  description: "Freedom from forced labor for men"
  codebook_question: "Are adult men free from servitude and other kinds of forced labor?"
  clarification: >-
    Involuntary servitude occurs when an adult is unable to quit a job s/he
    desires to leave --- not by reason of economic necessity but rather by
    reason of employer's coercion. This includes labor camps but not work
    or service which forms part of normal civic obligations such as
    conscription or employment in command economies.
  categories:
    - >-
      Male servitude or other kinds of forced labor is widespread and
      accepted (perhaps even organized) by the state.
    - >-
      Male servitude or other kinds of forced labor is substantial.
      Although officially opposed by the public authorities, the state is
      unwilling or unable to effectively contain the practice.
    - >-
      Male servitude or other kinds of forced labor exists but is not
      widespread and usually actively opposed by public authorities, or
      only tolerated in some particular areas or among particular social
      groups.
    - >-
      Male servitude or other kinds of forced labor is infrequent and only
      found in the criminal underground. It is actively and sincerely
      opposed by the public authorities.
    - >-
      Male servitude or other kinds of forced labor is virtually
      non-existent.
  state-dept: []
  freedom-house: []

v2clsocgrp:
  description: "Social group equality in respect for civil liberties"
  codebook_question: >-
    Do all social groups, as distinguished by language, ethnicity,
    religion, race, region, or caste, enjoy the same level of civil
    liberties, or are some groups generally in a more favorable position?
  clarification: >-
    Here, civil liberties are understood to include access to justice,
    private property rights, freedom of movement, and freedom from forced
    labor.
  categories:
    - >-
      Members of some social groups enjoy much fewer civil liberties than
      the general population.
    - >-
      Members of some social groups enjoy substantially fewer civil
      liberties than the general population.
    - >-
      Members of some social groups enjoy moderately fewer civil liberties
      than the general population.
    - >-
      Members of some social groups enjoy slightly fewer civil liberties
      than the general population.
    - >-
      Members of all salient social groups enjoy the same level of civil
      liberties.
  state-dept: []
  freedom-house: []

v2clstown:
  description: "State ownership of economy"
  codebook_question: "Does the state own or directly control important sectors of the economy?"
  clarification: >-
    This question gauges the degree to which the state owns and controls
    capital (including land) in the industrial, agricultural, and service
    sectors.  It does not measure the extent of government revenue and
    expenditure as a share of total output; indeed, it is quite common for
    states with expansive fiscal policies to exercise little direct control
    (and virtually no ownership) over the economy.
  categories:
    - >-
      Virtually all valuable capital belongs to the state or is directly
      controlled by the state. Private property may be officially
      prohibited.
    - >-
      Most valuable capital either belongs to the state or is directly
      controlled by the state.
    - >-
      Many sectors of the economy either belong to the state or are
      directly controlled by the state, but others remain relatively free
      of direct state control.
    - >-
      Some valuable capital either belongs to the state or is directly
      controlled by the state, but most remains free of direct state
      control.
    - >-
      Very little valuable capital belongs to the state or is directly
      controlled by the state.
  state-dept: []
  freedom-house: []

v2cltort:
  description: "Freedom from torture"
  codebook_question: "Is there freedom from torture?"
  clarification: >-
    Torture refers to the purposeful inflicting of extreme pain, whether
    mental or physical, with an aim to extract information or intimidate
    victims, who are in a state of incarceration. Here, we are concerned
    with torture practiced by state officials or other agents of the state
    (e.g., police, security forces, prison guards, and paramilitary
    groups).
  categories:
    - >-
      Not respected by public authorities. Torture is practiced
      systematically and is incited and approved by the leaders of
      government.
    - >-
      Weakly respected by public authorities. Torture is practiced
      frequently but is often not incited or approved by top leaders of
      government. At the same time, leaders of government are not actively
      working to prevent it.
    - >-
      Somewhat. Torture is practiced occasionally but is typically not
      approved by top leaders of government.
    - >-
      Mostly respected by public authorities. Torture is practiced in a few
      isolated cases but is not incited or approved by top government
      leaders.
    - "Fully respected by public authorities. Torture is non-existent."
  state-dept: []
  freedom-house: []

v2cltrnslw:
  description: "Transparent laws with predictable enforcement"
  codebook_question: >-
    Are the laws of the land clear, well publicized, coherent (consistent
    with each other), relatively stable from year to year, and enforced in
    a predictable manner?
  clarification: >-
    This question focuses on the transparency and predictability of the
    laws of the land.
  categories:
    - >-
      Transparency and predictability are almost non-existent. The laws of
      the land are created and/or enforced in completely arbitrary fashion.
    - >-
      Transparency and predictability are severely limited. The laws of the
      land are more often than not created and/or enforced in arbitrary
      fashion.
    - >-
      Transparency and predictability are somewhat limited. The laws of the
      land are mostly created in a non-arbitrary fashion but enforcement is
      rather arbitrary in some parts of the country.
    - >-
      Transparency and predictability are fairly strong. The laws of the
      land are usually created and enforced in a non-arbitrary fashion.
    - >-
      Transparency and predictability are very strong. The laws of the land
      are created and enforced in a non-arbitrary fashion.
  state-dept: []
  freedom-house: []

v2csantimv:
  description: "CSO anti-system movements"
  codebook_question: >-
    Among civil society organizations, are there anti-system opposition
    movements?
  clarification: >-
    An anti-system opposition movement is any movement --- peaceful or
    armed --- that is based in the country (not abroad) and is organized in
    opposition to the current political system. That is, it aims to change
    the polity in fundamental ways, e.g., from democratic to autocratic (or
    vice-versa), from capitalist to communist (or vice-versa), from secular
    to fundamentalist (or vice-versa). This movement may be linked to a
    political party that competes in elections but it must also have a
    "movement" character, which is to say a mass base and an existence
    separate from normal electoral competition. If there are several
    movements, please answer in a general way about the relationship of
    those movements to the regime.
  categories:
    - >-
      No, or very minimal. Anti-system movements are practically
      nonexistent.
    - >-
      There is only a low-level of anti-system movement activity but it
      does not pose much of a threat to the regime.
    - >-
      There is a modest level of anti-system movement activity, posing some
      threat to the regime.
    - >-
      There is a high level of anti-system movement activity, posing
      substantial threat to the regime.
    - >-
      There is a very high level of anti-system movement activity, posing a
      real and present threat to the regime.
  state-dept: []
  freedom-house: []

v2cscnsult:
  description: "CSO consultation"
  codebook_question: >-
    Are major civil society organizations (CSOs) routinely consulted by
    policymakers on policies relevant to their members?
  clarification: null
  categories:
    - >-
      No. There is a high degree of insulation of the government from CSO
      input. The government may sometimes enlist or mobilize CSOs after
      policies are adopted to sell them to the public at large. But it does
      not often consult with them in formulating policies.
    - >-
      To some degree. CSOs are but one set of voices that policymakers
      sometimes take into account.
    - >-
      Yes. Important CSOs are recognized as stakeholders in important
      policy areas and given voice on such issues. This can be accomplished
      through formal corporatist arrangements or through less formal
      arrangements.
  state-dept: []
  freedom-house: []

v2cseeorgs:
  description: "CSO entry and exit"
  codebook_question: >-
    To what extent does the government achieve control over entry and exit
    by civil society organizations (CSOs) into public life?
  clarification: null
  categories:
    - >-
      Monopolistic control. The government exercises an explicit monopoly
      over CSOs. The only organizations allowed to engage in political
      activity such as endorsing parties or politicians, sponsoring public
      issues forums, organizing rallies or demonstrations, engaging in
      strikes, or publicly commenting on public officials and policies are
      government-sponsored organizations. The government actively represses
      those who attempt to defy its monopoly on political activity.
    - >-
      Substantial control. The government licenses all CSOs and uses
      political criteria to bar organizations that are likely to oppose the
      government. There are at least some citizen-based organizations that
      play a limited role in politics independent of the government. The
      government actively represses those who attempt to flout its
      political criteria and bars them from any political activity.
    - >-
      Moderate control. Whether the government ban on independent CSOs is
      partial or full, some prohibited organizations manage to play an
      active political role. Despite its ban on organizations of this sort,
      the government does not or cannot repress them, due to either its
      weakness or political expedience.
    - >-
      Minimal control. Whether or not the government licenses CSOs, there
      exist constitutional provisions that allow the government to ban
      organizations or movements that have a history of anti-democratic
      action in the past (e.g. the banning of neo-fascist or communist
      organizations in the Federal Republic of Germany). Such banning takes
      place under strict rule of law and conditions of judicial
      independence.
    - >-
      Unconstrained. Whether or not the government licenses CSOs, the
      government does not impede their formation and operation unless they
      are engaged in activities to violently overthrow the government.
  state-dept: []
  freedom-house: []

v2csgender:
  description: "CSO women's participation"
  codebook_question: >-
    Are women prevented from participating in civil society organizations
    (CSOs)?
  clarification: >-
    Please pay attention to both (A) whether women are prevented from
    participating in civil society organizations (CSOs) because of their
    gender and (B) whether CSOs pursuing women's interests are prevented
    from taking part in associational life.
  categories:
    - "Almost always."
    - "Frequently."
    - "About half the time."
    - "Rarely."
    - "Almost never."
  state-dept: []
  freedom-house: []

v2csprtcpt:
  description: "CSO participatory environment"
  codebook_question: >-
    Which of these best describes the involvement of people in civil
    society organizations (CSOs)?
  clarification: null
  categories:
    - >-
      Most associations are state-sponsored, and although a large number of
      people may be active in them, their participation is not purely
      voluntary.
    - "Voluntary CSOs exist but few people are active in them."
    - "There are many diverse CSOs, but popular involvement is minimal."
    - >-
      There are many diverse CSOs and it is considered normal for people to
      be at least occasionally active in at least one of them.
  state-dept: []
  freedom-house: []

v2csreprss:
  description: "CSO repression"
  codebook_question: >-
    Does the government attempt to repress civil society organizations
    (CSOs)?
  clarification: null
  categories:
    - >-
      Severely. The government violently and actively pursues all real and
      even some imagined members of CSOs. They seek not only to deter the
      activity of such groups but to effectively liquidate them. Examples
      include Stalinist Russia, Nazi Germany, and Maoist China.
    - >-
      Substantially. In addition to the kinds of harassment outlined in
      responses 2 and 3 below, the government also arrests, tries, and
      imprisons leaders of and participants in oppositional CSOs who have
      acted lawfully. Other sanctions include disruption of public
      gatherings and violent sanctions of activists (beatings, threats to
      families, destruction of valuable property). Examples include
      Mugabe's Zimbabwe, Poland under Martial Law, Serbia under Milosevic.
    - >-
      Moderately. In addition to material sanctions outlined in response 3
      below, the government also engages in minor legal harassment
      (detentions, short-term incarceration) to dissuade CSOs from acting
      or expressing themselves. The government may also restrict the scope
      of their actions through measures that restrict association of civil
      society organizations with each other or political parties, bar civil
      society organizations from taking certain actions, or block
      international contacts. Examples include post-Martial Law Poland,
      Brazil in the early 1980s, the late Franco period in Spain.
    - >-
      Weakly. The government uses material sanctions (fines, firings,
      denial of social services) to deter oppositional CSOs from acting or
      expressing themselves. They may also use burdensome registration or
      incorporation procedures to slow the formation of new civil society
      organizations and sidetrack them from engagement. The government may
      also organize Government Organized Movements or NGOs (GONGOs) to
      crowd out independent organizations. One example would be Singapore
      in the post-Yew phase or Putin's Russia.
    - >-
      No. Civil society organizations are free to organize, associate,
      strike, express themselves, and to criticize the government without
      fear of government sanctions or harassment.
  state-dept: []
  freedom-house: []

v2csrlgcon:
  description: "Religious organization consultation"
  codebook_question: >-
    Are major religious organizations routinely consulted by policymakers
    on policies relevant to their members?
  clarification: null
  categories:
    - >-
      No. There is a high degree of insulation of the government from input
      from religious organizations. The government may sometimes enlist or
      mobilize religious organizations after policies are adopted to sell
      them to the public at large. But typically, it does not consult with
      them in formulating policies.
    - >-
      To some degree. Religious organizations are but one set of voices
      that policymakers sometimes take into account.
    - >-
      Yes. Important religious organizations are recognized as stakeholders
      in important policy areas and given voice on such issues. This can be
      accomplished through formal corporatist arrangements or through less
      formal arrangements.
  state-dept: []
  freedom-house: []

v2csrlgrep:
  description: "Religious organization repression"
  codebook_question: "Does the government attempt to repress religious organizations?"
  clarification: null
  categories:
    - >-
      Severely. The government violently and actively pursues all real and
      even some imagined members of religious organizations. It seeks not
      only to deter the activity of such groups but also to effectively
      liquidate them. Examples include Stalinist Russia and Maoist China.
    - >-
      Substantially. In addition to the kinds of harassment outlined in 2
      and 3 below, the government also arrests, tries, and imprisons
      leaders of and participants in oppositional religious organizations
      who have acted lawfully. Other sanctions include disruption of public
      gatherings and violent sanctions of activists (beatings, threats to
      families, destruction of valuable property).
    - >-
      Moderately. In addition to material sanctions outlined in 3 below,
      the government also engages in minor legal harassment (detentions,
      short-term incarceration) to dissuade religious organizations from
      acting or expressing themselves. The government may also restrict the
      scope of their actions through measures that restrict association of
      religious civil society organizations with each other or political
      parties, bar religious civil society organizations from taking
      certain actions, or block international contacts.
    - >-
      Weakly. The government uses material sanctions (fines, firings,
      denial of social services) to deter oppositional religious
      organizations from acting or expressing themselves. They may also use
      burdensome registration or incorporation procedures to slow the
      formation of new religious civil society organizations and sidetrack
      them from engagement. The government may also organize parallel
      religious organizations to crowd out independent religious
      organizations.
    - >-
      No. Religious civil society organizations are free to organize,
      associate, strike, express themselves, and to criticize the
      government without fear of government sanctions or harassment.
  state-dept: []
  freedom-house: []

v2smarrest:
